<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alcance</title>
<!-- FORA DOS BUSCADORES. Não é segurança (ver o aviso no rodapé), é higiene. -->
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="color-scheme" content="light">
<link rel="icon" href="../icone.svg" type="image/svg+xml">
<style>
  /* UMA SÓ MÉTRICA, e ela é a única deste projeto em que o aparelho de quem
     publica conta exatamente 1: o farol do app (1 por aparelho por dia).
     Tudo o mais — downloads, visitas, adoção da base, consulta do OTA — conta
     máquina, robô ou teste, e saiu. Sem número acumulado: cada barra é uma
     semana, e a semana é o que se lê. */
  :root {
    --bg:#dfe3e7; --panel:#fff; --panel-2:#d4dae2;
    --text:#4a4a4a; --titulo:#22303d; --muted:#55606d; --accent:#2f557f; --rule:#c6cfd9;
    --s1:#2e6de7;   /* bluejay */
  }
  * { box-sizing:border-box; }
  body {
    margin:0; background:var(--bg); color:var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size:16px; line-height:1.55; -webkit-font-smoothing:antialiased;
  }
  .env { max-width:52rem; margin:0 auto; padding:1.4rem 1.15rem 4rem; }
  a { color:var(--accent); }
  h1 { font-size:1.6rem; margin:0 0 .15rem; letter-spacing:-.02em; color:var(--titulo); }
  h2 { font-size:1.02rem; margin:2.2rem 0 .2rem; letter-spacing:-.01em; color:var(--titulo); }
  .sub { color:var(--muted); font-size:.9rem; margin:0 0 .4rem; }
  .volta { font-size:.8rem; text-decoration:none; color:var(--muted); }
  .volta:hover { text-decoration:underline; }

  .nota {
    background:var(--panel-2); border-radius:12px; padding:.75rem .95rem;
    font-size:.82rem; color:var(--muted); margin:1rem 0 0; line-height:1.5;
  }
  .nota b { color:var(--text); }
  code { background:rgba(0,0,0,.06); border-radius:4px; padding:0 .25rem; font-size:.92em; }

  .kpis { display:grid; grid-template-columns:1fr 1fr; gap:.55rem; margin-top:1.1rem; }
  .kpi { background:var(--panel); border-radius:14px; padding:.9rem 1rem; }
  .kpi-n {
    font-size:1.9rem; font-weight:800; letter-spacing:-.03em; line-height:1.1;
    color:var(--titulo); font-variant-numeric:tabular-nums;
  }
  .kpi-r { font-size:.75rem; color:var(--muted); margin-top:.2rem; line-height:1.35; }

  .caixa { background:var(--panel); border-radius:14px; padding:1rem .9rem .7rem; margin-top:.55rem; }
  .legenda { margin:0 0 .2rem; font-size:.76rem; color:var(--muted); }

  /* ===== as semanas: uma barra por semana ===== */
  .semanas { display:flex; align-items:flex-end; gap:4px; height:170px; margin-top:.3rem; }
  .sem { flex:1; display:flex; flex-direction:column; justify-content:flex-end; height:100%; }
  .sem-v {
    display:block; text-align:center; font-size:.66rem; font-weight:700; color:var(--titulo);
    font-variant-numeric:tabular-nums; margin-bottom:.2rem;
  }
  .sem b {
    display:block; background:var(--s1); border-radius:5px 5px 0 0; min-height:2px;
    transition:height .3s;
  }
  .sem.vazia b { background:var(--rule); }
  .sem i {
    display:block; font-style:normal; font-size:.56rem; color:var(--muted);
    text-align:center; margin-top:.35rem; line-height:1; height:1.1em;
  }

  details { margin-top:.6rem; }
  summary { cursor:pointer; font-size:.85rem; color:var(--accent); }
  table { border-collapse:collapse; width:100%; font-size:.82rem; margin-top:.5rem; }
  th, td { text-align:right; padding:.3rem .5rem; font-variant-numeric:tabular-nums; }
  th:first-child, td:first-child { text-align:left; }
  thead th { color:var(--muted); font-weight:600; }
  tbody tr:nth-child(odd) { background:var(--panel-2); }
  .tw { overflow-x:auto; }

  #tranca { padding:4rem 1.15rem; text-align:center; color:var(--muted); }
</style>
</head>
<body>

<div id="tranca">Não encontrado.</div>
<div class="env" id="pag" hidden></div>

<script>
(function () {
  'use strict';

  // ===================================================================
  // A TRANCA — obscuridade, não segredo
  // ===================================================================
  var CHAVE = 'alcance';
  var REPO = 'jonathasptbr-gh/Audio-Visual-IASD';
  // `raw.githubusercontent.com` e não o asset: asset de release não manda CORS.
  var SERIE = 'https://raw.githubusercontent.com/' + REPO + '/dados/serie.json';

  var trancaEl = document.getElementById('tranca');
  var pagEl = document.getElementById('pag');

  function chaveOk() { return (location.hash || '').replace(/^#/, '') === CHAVE; }
  if (!chaveOk()) return;
  window.addEventListener('hashchange', function () { location.reload(); });
  trancaEl.hidden = true;
  pagEl.hidden = false;

  // ---------- utilidades ----------
  var esc = function (s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  };
  var num = function (n) { return (n || 0).toLocaleString('pt-BR'); };
  var dec = function (n) { return (Math.round(n * 10) / 10).toLocaleString('pt-BR'); };
  var dia = function (t) { return String(t).slice(0, 10); };
  var diaBr = function (d) { var p = d.split('-'); return p[2] + '/' + p[1]; };
  var pad = function (n) { return String(n).padStart(2, '0'); };
  var iso = function (dt) { return dt.getFullYear() + '-' + pad(dt.getMonth() + 1) + '-' + pad(dt.getDate()); };

  // O SÁBADO DA SEMANA daquela data (a semana vai de domingo a sábado).
  function sabadoDe(d) {
    var dt = new Date(d + 'T12:00:00');
    dt.setDate(dt.getDate() + (6 - dt.getDay()));
    return iso(dt);
  }

  function erro(msg, detalhe) {
    pagEl.innerHTML = '<h1>Alcance do app</h1>'
      + '<p class="sub">' + esc(msg) + '</p>'
      + (detalhe ? '<div class="nota">' + esc(detalhe) + '</div>' : '');
  }

  fetch(SERIE, { cache: 'no-store' })
    .then(function (r) {
      if (r.status === 404) throw new Error('404');
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    })
    .then(desenhar)
    .catch(function (e) {
      if (String(e.message) === '404') {
        erro('A série ainda não existe.',
          'O workflow "Série de uso" grava a primeira amostra na próxima hora '
          + 'cheia. Até lá não há o que desenhar.');
      } else {
        erro('Não deu para ler a série.', String(e.message));
      }
    });

  // ===================================================================
  // O DESENHO
  // ===================================================================
  function desenhar(d) {
    var am = (d && d.amostras) || [];
    if (!am.length) { erro('A série está vazia.', 'Nenhuma amostra gravada ainda.'); return; }
    var ultima = am[am.length - 1];

    // ---- por dia: a ÚLTIMA amostra de cada dia (os contadores são acumulados,
    //      e o painel mostra só a DIFERENÇA — nada cumulativo) ----
    var porDia = {};
    am.forEach(function (a) { porDia[dia(a.t)] = a; });
    var dias = Object.keys(porDia).sort();

    var diario = {};   // 'YYYY-MM-DD' → aparelhos daquele dia
    for (var i = 1; i < dias.length; i++) {
      var a = porDia[dias[i - 1]].farol || 0;
      var b = porDia[dias[i]].farol || 0;
      if (b >= a) diario[dias[i]] = b - a;
    }

    // ---- por semana: o MAIOR dia da semana (domingo a sábado) ----
    // É o número que o operador pediu: uma vez por semana, o dia em que a
    // igreja usa (o sábado, no comum). Um aparelho que abre a semana inteira
    // continua contando 1 por dia — o máximo não soma, ele pega o dia cheio.
    var semanas = {};
    Object.keys(diario).forEach(function (dd) {
      var s = sabadoDe(dd);
      if (!(s in semanas) || diario[dd] > semanas[s]) semanas[s] = diario[dd];
    });

    // ---- O DESCONTO DO APARELHO DO OPERADOR ----
    // O farol conta 1 por aparelho por dia, e o dele entra como qualquer outro.
    // Ele pediu o desconto: 1 por semana, nunca abaixo de zero. Não é
    // estimativa — é um aparelho conhecido, e o painel diz que descontou.
    var DESCONTO = 1;
    var lista = Object.keys(semanas).sort().map(function (s) {
      return { s: s, v: Math.max(0, semanas[s] - DESCONTO) };
    });

    // as últimas 12 semanas COM dado (semana sem amostra não vira zero)
    var ultimas = lista.slice(-12);
    var ultimaSemana = ultimas.length ? ultimas[ultimas.length - 1] : null;
    var janela4 = ultimas.slice(-4);
    var media4 = janela4.length
      ? janela4.reduce(function (s, w) { return s + w.v; }, 0) / janela4.length : null;

    var h = [];
    h.push('<a class="volta" href="../">← site</a>');
    h.push('<h1>Alcance do app</h1>');
    h.push('<p class="sub">' + esc(am.length) + ' amostra(s) · última em '
      + esc(new Date(ultima.t).toLocaleString('pt-BR')) + '</p>');

    h.push('<div class="kpis">');
    h.push(kpi(ultimaSemana ? num(ultimaSemana.v) : '—',
      'aparelhos na semana de ' + (ultimaSemana ? diaBr(ultimaSemana.s) : '—')));
    h.push(kpi(media4 !== null ? dec(media4) : '—',
      'média das últimas 4 semanas'));
    h.push('</div>');

    // ---- o gráfico das semanas ----
    h.push('<h2>Aparelhos por semana</h2>');
    h.push('<div class="caixa">');
    h.push('<p class="legenda">Dia de maior uso da semana, menos 1: o aparelho '
      + 'de quem publica.</p>');
    h.push(barras(ultimas));
    h.push(tabela(lista));
    h.push('</div>');

    pagEl.innerHTML = h.join('');
  }

  function kpi(n, r) {
    return '<div class="kpi"><div class="kpi-n">' + esc(n) + '</div>'
      + '<div class="kpi-r">' + esc(r) + '</div></div>';
  }

  // ===================================================================
  // AS BARRAS — uma por semana, com o número em cima
  // ===================================================================
  function barras(semanas) {
    if (!semanas.length) return '<p class="sub">Sem semanas com amostra.</p>';
    var max = Math.max.apply(null, semanas.map(function (w) { return w.v; }).concat([1]));
    var o = ['<div class="semanas">'];
    // rótulo de data a cada duas semanas, e sempre na última — mas a penúltima
    // sai se cair ao lado dela, senão as duas se encostam no celular.
    var comData = {};
    semanas.forEach(function (_, i) { if (i % 2 === 0) comData[i] = true; });
    comData[semanas.length - 1] = true;
    if (semanas.length > 2) delete comData[semanas.length - 2];
    semanas.forEach(function (w, i) {
      var alt = Math.max(2, 100 * w.v / max);
      var mostraData = !!comData[i];
      o.push('<div class="sem">'
        + '<span class="sem-v">' + w.v + '</span>'
        + '<b style="height:' + alt.toFixed(1) + '%" title="semana de '
        + esc(diaBr(w.s)) + ': ' + w.v + ' aparelho(s)"></b>'
        + '<i>' + (mostraData ? diaBr(w.s) : '') + '</i></div>');
    });
    o.push('</div>');
    return o.join('');
  }

  function tabela(lista) {
    var l = ['<details><summary>Ver a tabela</summary><div class="tw"><table>',
      '<thead><tr><th>Semana de</th><th>Aparelhos</th></tr></thead><tbody>'];
    lista.slice().reverse().forEach(function (w) {
      l.push('<tr><td>' + esc(diaBr(w.s)) + '</td><td>' + w.v + '</td></tr>');
    });
    l.push('</tbody></table></div></details>');
    return l.join('');
  }
})();
</script>
</body>
</html>
