<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alcance</title>
<!-- FORA DOS BUSCADORES. Não é segurança (ver o aviso no rodapé), é higiene. -->
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="color-scheme" content="light">
<link rel="icon" href="../icone.svg" type="image/svg+xml">
<style>
  /* A paleta é a do site (`site/index.html`), que é a do app — e CLARA E SÓ
     CLARA pela mesma razão declarada lá: um padrão só, olhado uma vez.

     AS TRÊS CORES DE SÉRIE NÃO SAEM DAQUI POR GOSTO: `bluejay`, `campfire` e
     `emperor` são valores OFICIAIS da identidade IASD, e o par azul/laranja foi
     validado antes (ΔE 30,3 em protanopia). O roxo entra como terceira por ser
     o mais ESCURO dos dezoito — a distância de luminância é o canal que sobra
     quando a matiz se perde. O denim (o accent do site) reprovou como marca de
     dado: croma 0,082, lê como cinza. Ele é cor de texto, não de série. */
  :root {
    --bg:#dfe3e7; --panel:#fff; --panel-2:#d4dae2;
    --text:#4a4a4a; --titulo:#22303d; --muted:#55606d; --accent:#2f557f; --rule:#c6cfd9;
    --s1:#2e6de7;   /* bluejay  — usaram */
    --s2:#cd4900;   /* campfire — visitaram */
    --s3:#4b207f;   /* emperor  — baixaram */
  }
  * { box-sizing:border-box; }
  body {
    margin:0; background:var(--bg); color:var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size:16px; line-height:1.55; -webkit-font-smoothing:antialiased;
  }
  .env { max-width:56rem; margin:0 auto; padding:1.4rem 1.15rem 4rem; }
  a { color:var(--accent); }
  h1 { font-size:1.6rem; margin:0 0 .15rem; letter-spacing:-.02em; color:var(--titulo); }
  h2 { font-size:1.02rem; margin:2.2rem 0 .2rem; letter-spacing:-.01em; color:var(--titulo); }
  .sub { color:var(--muted); font-size:.9rem; margin:0 0 .4rem; }
  .volta { font-size:.8rem; text-decoration:none; color:var(--muted); }
  .volta:hover { text-decoration:underline; }

  .nota {
    background:var(--panel-2); border-radius:12px; padding:.75rem .95rem;
    font-size:.82rem; color:var(--muted); margin:1rem 0 0; line-height:1.5;
  }
  .nota b { color:var(--text); }
  code { background:rgba(0,0,0,.06); border-radius:4px; padding:0 .25rem; font-size:.92em; }

  /* ===== os números ===== */
  .kpis { display:grid; grid-template-columns:repeat(2,1fr); gap:.6rem; margin-top:1.1rem; }
  @media (min-width:44rem) { .kpis { grid-template-columns:repeat(4,1fr); } }
  .kpi { background:var(--panel); border-radius:14px; padding:.85rem 1rem; }
  .kpi-n {
    font-size:1.9rem; font-weight:800; letter-spacing:-.03em; line-height:1.1;
    color:var(--titulo); font-variant-numeric:tabular-nums;
  }
  .kpi-r { font-size:.76rem; color:var(--muted); margin-top:.2rem; line-height:1.4; }

  /* ===== as caixas de seção ===== */
  .caixa { background:var(--panel); border-radius:14px; padding:1rem .9rem .7rem; margin-top:.55rem; }
  figure { margin:0; }
  figcaption { font-size:.78rem; color:var(--muted); padding:.2rem .3rem .4rem; }
  svg { display:block; width:100%; height:auto; overflow:visible; }

  .legenda { display:flex; gap:.9rem; flex-wrap:wrap; padding:.1rem .3rem .5rem; font-size:.82rem; }
  .legenda span { display:inline-flex; align-items:center; gap:.35rem; color:var(--muted); }
  .pip { width:10px; height:10px; border-radius:3px; display:inline-block; flex:none; }

  details { margin-top:.5rem; }
  summary { cursor:pointer; font-size:.85rem; color:var(--accent); }
  table { border-collapse:collapse; width:100%; font-size:.82rem; margin-top:.5rem; }
  th, td { text-align:right; padding:.3rem .5rem; font-variant-numeric:tabular-nums; }
  th:first-child, td:first-child { text-align:left; }
  thead th { color:var(--muted); font-weight:600; }
  tbody tr:nth-child(odd) { background:var(--panel-2); }
  .tw { overflow-x:auto; }

  /* ===== as barras por versão ===== */
  .barras { display:grid; gap:.35rem; }
  .barra { display:grid; grid-template-columns:7.5rem 1fr auto; align-items:center; gap:.6rem; font-size:.84rem; }
  .barra-t { color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .barra-c { background:var(--panel-2); border-radius:4px; height:14px; display:block; }
  .barra-f { background:var(--s1); border-radius:4px; height:14px; min-width:3px; display:block; }
  .barra-n { font-variant-numeric:tabular-nums; font-weight:600; }

  /* ===== as definições ===== */
  .defs { display:grid; gap:.5rem; margin-top:.55rem; }
  @media (min-width:44rem) { .defs { grid-template-columns:repeat(3,1fr); } }
  .def { background:var(--panel); border-radius:14px; padding:.9rem .95rem; }
  .def h3 { margin:0 0 .2rem; font-size:.9rem; color:var(--titulo); display:flex; align-items:center; gap:.4rem; }
  .def p { margin:0; font-size:.79rem; color:var(--muted); line-height:1.45; }

  /* ===== o agora ===== */
  .agora { display:flex; align-items:baseline; gap:.7rem; flex-wrap:wrap; }
  .agora .kpi-n { color:var(--titulo); }
  .agora .kpi-r { margin-top:0; }

  #dica {
    position:fixed; pointer-events:none; opacity:0; transition:opacity .1s;
    background:var(--titulo); color:#fff; border-radius:8px; padding:.45rem .6rem;
    font-size:.78rem; line-height:1.35; white-space:nowrap; z-index:9;
  }
  #tranca { padding:4rem 1.15rem; text-align:center; color:var(--muted); }
</style>
</head>
<body>

<div id="tranca">Não encontrado.</div>
<div class="env" id="pag" hidden></div>
<div id="dica" role="status" aria-live="polite"></div>

<script>
(function () {
  'use strict';

  // ===================================================================
  // A TRANCA — e o que ela NÃO é
  // ===================================================================
  // OBSCURIDADE, não segredo: a chave está no HTML, e os contadores são API
  // pública de um repositório público. Ela existe para esta página não estar
  // na frente de quem veio baixar o app — e desde 2026-11-10 ela é alcançável
  // por um link discreto no rodapé do site (a chave vai no próprio link).
  var CHAVE = 'alcance';

  // Quantas versões de APK ganham barra própria; o resto vira UMA linha somada.
  var APK_NA_LISTA = 6;

  var REPO = 'jonathasptbr-gh/Audio-Visual-IASD';
  // `raw.githubusercontent.com` e não o asset de release: asset não manda CORS.
  var SERIE = 'https://raw.githubusercontent.com/' + REPO + '/dados/serie.json';

  var trancaEl = document.getElementById('tranca');
  var pagEl = document.getElementById('pag');
  var dicaEl = document.getElementById('dica');

  function chaveOk() { return (location.hash || '').replace(/^#/, '') === CHAVE; }
  if (!chaveOk()) return;              // fica o "Não encontrado."
  window.addEventListener('hashchange', function () { location.reload(); });

  // NÃO HÁ MARCA DE OPERADOR (v1.4.42): o uso próprio ENTRA nos números, e o
  // painel diz isso logo abaixo deles. A única exclusão que restou é o build
  // debuggável, que acende num contador separado por construção.
  trancaEl.hidden = true;
  pagEl.hidden = false;

  // ---------- utilidades ----------
  var esc = function (s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  };
  var num = function (n) { return (n || 0).toLocaleString('pt-BR'); };
  var dec = function (n) { return (Math.round(n * 10) / 10).toLocaleString('pt-BR'); };
  var dia = function (t) { return String(t).slice(0, 10); };
  var diaBr = function (d) { var p = d.split('-'); return p[2] + '/' + p[1]; };

  function erro(msg, detalhe) {
    pagEl.innerHTML = '<h1>Alcance do app</h1>'
      + '<p class="sub">' + esc(msg) + '</p>'
      + (detalhe ? '<div class="nota">' + esc(detalhe) + '</div>' : '');
  }

  fetch(SERIE, { cache: 'no-store' })
    .then(function (r) {
      if (r.status === 404) throw new Error('404');
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    })
    .then(desenhar)
    .catch(function (e) {
      if (String(e.message) === '404') {
        erro('A série ainda não existe.',
          'O workflow "Série de uso" grava a primeira amostra na próxima hora '
          + 'cheia (ele roda no minuto 17). Até lá não há o que desenhar — e '
          + 'isso não é falha nenhuma.');
      } else {
        erro('Não deu para ler a série.', String(e.message));
      }
    });

  // ===================================================================
  // O DESENHO
  // ===================================================================
  function desenhar(d) {
    var am = (d && d.amostras) || [];
    if (!am.length) { erro('A série está vazia.', 'Nenhuma amostra gravada ainda.'); return; }
    var ultima = am[am.length - 1];

    // ---- por dia: a ÚLTIMA amostra de cada dia (contadores são acumulados) ----
    var porDia = {};
    am.forEach(function (a) { porDia[dia(a.t)] = a; });
    var dias = Object.keys(porDia).sort();

    // ---- a DIFERENÇA entre dias é a contagem daquele dia ----
    // Contador monotônico: diferença negativa é asset recriado. Tratar como
    // negativo desenharia um vale que nunca aconteceu.
    function serieDiaria(campo) {
      var fora = [];
      for (var i = 1; i < dias.length; i++) {
        var a = porDia[dias[i - 1]][campo] || 0;
        var b = porDia[dias[i]][campo] || 0;
        fora.push({ d: dias[i], v: b >= a ? b - a : null });
      }
      return fora;
    }
    var apar = serieDiaria('farol');
    var visi = serieDiaria('visita');

    // ---- downloads de APK por dia: soma do delta de cada asset ----
    // O asset novo conta o valor inteiro (ele nasceu entre as duas amostras).
    // O asset que sumiu (faxina) simplesmente não está no dia seguinte: fica
    // de fora, em vez de virar um delta negativo.
    var baix = [];
    for (var i = 1; i < dias.length; i++) {
      var ap = porDia[dias[i - 1]].apk || {}, bp = porDia[dias[i]].apk || {};
      var soma = 0, ok = false;
      Object.keys(bp).forEach(function (n) {
        if (!/\.apk$/i.test(n)) return;
        var antes = ap[n];
        if (antes === undefined) { soma += bp[n]; ok = true; }
        else if (bp[n] >= antes) { soma += bp[n] - antes; ok = true; }
      });
      baix.push({ d: dias[i], v: ok ? soma : 0 });
    }

    // ---- os totais de vida inteira saem da MARCA D'ÁGUA ----
    var visto = (d && d.visto) || {};
    var totalApk = 0, apks = [], contagem = {};
    Object.keys(visto).forEach(function (n) { contagem[n] = visto[n]; });
    Object.keys(ultima.apk || {}).forEach(function (n) {
      if (contagem[n] === undefined) contagem[n] = ultima.apk[n];
    });
    Object.keys(contagem).forEach(function (n) {
      if (/\.apk$/i.test(n)) {
        totalApk += contagem[n];
        var m = n.match(/-v([\d.]+)\.apk$/i);
        apks.push({ n: n, v: contagem[n], ver: m ? m[1] : null });
      }
    });
    // ORDENADO POR VERSÃO (não por contagem): responde "como está a adoção",
    // que é a pergunta do painel — a contagem é arqueologia.
    apks.sort(function (a, b) {
      if (!a.ver) return 1;
      if (!b.ver) return -1;
      return cmpVer(b.ver, a.ver);
    });

    var ultDia = apar.length ? apar[apar.length - 1] : null;
    var ultVis = visi.length ? visi[visi.length - 1] : null;
    var ultBaix = baix.length ? baix[baix.length - 1] : null;
    var baseAtual = Object.keys(ultima.web || {}).sort(cmpVer).pop();
    var baseN = (ultima.web || {})[baseAtual] || 0;

    var h = [];
    h.push('<a class="volta" href="../">← site</a>');
    h.push('<h1>Alcance do app</h1>');
    h.push('<p class="sub">' + esc(am.length) + ' amostra(s) · última em '
      + esc(new Date(ultima.t).toLocaleString('pt-BR')) + '</p>');

    // ---- os quatro números ----
    h.push('<div class="kpis">');
    h.push(kpi(num(totalApk), 'downloads de APK, desde a v1.0'));
    h.push(kpi(ultDia && ultDia.v !== null ? num(ultDia.v) : '—',
      'aparelhos usaram o app em ' + (ultDia ? diaBr(ultDia.d) : '')));
    h.push(kpi(ultVis && ultVis.v !== null ? num(ultVis.v) : '—',
      'visitas ao site em ' + (ultVis ? diaBr(ultVis.d) : '')));
    h.push(kpi(num(baseN), 'baixaram a base v' + (baseAtual || '—') + ' (adoção)'));
    h.push('</div>');

    // ---- O QUE ESTES NÚMEROS INCLUEM (o oráculo cobra esta frase) ----
    h.push('<div class="nota"><b>Estes números incluem o uso próprio.</b> '
      + 'O aparelho de quem publica conta como qualquer outro, e as visitas de '
      + 'quem abre esta página também — não há chave de exclusão, nem no app nem '
      + 'aqui. Fica de fora só o app rodando em build de teste (emulador, '
      + '<code>assembleDebug</code>), que acende num contador separado por '
      + 'construção.</div>');

    // ---- a linha do tempo: TRÊS SÉRIES, UMA UNIDADE (contagem por dia) ----
    h.push('<h2>Por dia</h2>');
    h.push('<p class="sub">Quem baixou o APK, quem usou o app e quem visitou a '
      + 'página — todos na mesma unidade, para poderem ser lidos juntos.</p>');
    h.push('<div class="caixa">');
    h.push('<div class="legenda">'
      + '<span><i class="pip" style="background:var(--s3)"></i>Baixaram (APK)</span>'
      + '<span><i class="pip" style="background:var(--s1)"></i>Usaram (app)</span>'
      + '<span><i class="pip" style="background:var(--s2)"></i>Visitaram (site)</span>'
      + '</div>');
    h.push(linhas([
      { nome: 'Baixaram', cor: 'var(--s3)', pts: baix },
      { nome: 'Usaram', cor: 'var(--s1)', pts: apar },
      { nome: 'Visitaram', cor: 'var(--s2)', pts: visi },
    ]));
    h.push(tabela(dias, porDia, baix, apar, visi));
    h.push('</div>');

    // ---- agora (a estimativa pela consulta do OTA) ----
    h.push(agora(am));

    // ---- downloads por versão ----
    h.push('<h2>Downloads por versão do APK</h2>');
    h.push('<p class="sub">Eventos de download — não instalações, e não pessoas: '
      + 'robô, espelho, reinstalação e a segunda tentativa de quem estava sem '
      + 'sinal contam igual.</p>');
    h.push('<div class="caixa"><div class="barras">');
    var recentes = apks.slice(0, APK_NA_LISTA);
    var passado = apks.slice(APK_NA_LISTA);
    var somaPassado = passado.reduce(function (s, a) { return s + a.v; }, 0);
    var maiorApk = Math.max(
      recentes.length ? recentes[0].v : 1,
      apks.reduce(function (m, a) { return Math.max(m, a.v); }, 1),
      somaPassado) || 1;
    function barra(rot, val, titulo, cor) {
      return '<div class="barra">'
        + '<span class="barra-t" title="' + esc(titulo || rot) + '">' + esc(rot) + '</span>'
        + '<span class="barra-c"><span class="barra-f" style="width:'
        + (100 * val / maiorApk).toFixed(1) + '%'
        + (cor ? ';background:' + cor : '') + '"></span></span>'
        + '<span class="barra-n">' + num(val) + '</span>'
        + '</div>';
    }
    recentes.forEach(function (a) {
      h.push(barra(a.n.replace(/^audio-visual-iasd-?/, '').replace(/\.apk$/, '') || 'nome fixo',
        a.v, a.n));
    });
    if (passado.length) {
      h.push(barra(passado.length + ' anteriores', somaPassado,
        passado.map(function (a) {
          return (a.ver ? 'v' + a.ver : 'nome fixo') + ': ' + a.v;
        }).join(' · '),
        'var(--panel-2)'));
    }
    if (!apks.length) h.push('<p class="sub">Nada amostrado ainda.</p>');
    h.push('</div></div>');

    // ---- o que cada linha é ----
    h.push('<h2>O que cada linha é</h2>');
    h.push('<div class="defs">');
    h.push(def('Baixaram (APK)', 'var(--s3)',
      'Eventos de download do arquivo do app. Reinstalação, troca de aparelho e '
      + 'a segunda tentativa de quem estava sem sinal contam de novo — é um teto '
      + 'do alcance, nunca uma contagem de gente.'));
    h.push(def('Usaram (app)', 'var(--s1)',
      'Aparelhos que abriram o app no dia. O farol acende uma vez por aparelho '
      + 'por dia: um aparelho usado em dois dias conta nos dois, e o de quem '
      + 'publica entra na conta.'));
    h.push(def('Visitaram (site)', 'var(--s2)',
      'Navegadores que abriram a página de download, uma vez por dia cada. '
      + 'É o funil: quem viu a página × quem instalou × quem usou.'));
    h.push('</div>');

    // ---- o que não dá para saber ----
    h.push('<div class="nota"><b>Instalados</b> não existe sem identificar o '
      + 'aparelho, e identificar é exatamente o que este projeto não faz. O mais '
      + 'perto é a 4ª caixa: aparelhos que baixaram a base atual — o que um '
      + 'aparelho instalado e atualizado faz.</div>');
    h.push('<div class="nota"><b>Esta página é discreta, não secreta.</b> '
      + 'A chave está no HTML, e os contadores são API pública de um repositório '
      + 'público — qualquer pessoa que saiba onde olhar lê os mesmos números. '
      + 'O que a chave faz é manter isto fora do caminho de quem veio baixar o '
      + 'app. O contrato inteiro está em <code>docs/MEDICAO-DE-ALCANCE.md</code>.'
      + '</div>');

    pagEl.innerHTML = h.join('');
    ligarDica();
  }

  function kpi(n, r) {
    return '<div class="kpi"><div class="kpi-n">' + esc(n) + '</div>'
      + '<div class="kpi-r">' + esc(r) + '</div></div>';
  }

  function def(titulo, cor, texto) {
    return '<div class="def"><h3><i class="pip" style="background:' + cor + '"></i>'
      + esc(titulo) + '</h3><p>' + esc(texto) + '</p></div>';
  }

  // Versões comparadas NUMERICAMENTE por componente — `4.9 < 4.82` como string.
  function cmpVer(a, b) {
    var x = String(a).split('.').map(Number), y = String(b).split('.').map(Number);
    for (var i = 0; i < Math.max(x.length, y.length); i++) {
      var p = x[i] || 0, q = y[i] || 0;
      if (p !== q) return p - q;
    }
    return 0;
  }

  // ===================================================================
  // AGORA — a estimativa que sai da consulta do OTA
  // ===================================================================
  // Todo app aberto consulta o manifesto do OTA 240×/h em primeiro plano e
  // 30×/h em segundo (`WebUpdater`). A variação do contador entre duas
  // amostras é, portanto, um medidor de aparelhos com o app aberto — mas a
  // mistura entre os dois planos é irredutível deste lado, então o honesto é
  // um INTERVALO, nunca um número. Só vale para intervalos curtos (≤ 3 h): entre
  // duas amostras de 24 h não há como saber quanto veio de qual hora.
  function agora(am) {
    var base = '<h2>Agora</h2>';
    if (am.length < 2) {
      return base + '<p class="sub">Sem amostras suficientes.</p>';
    }
    var a = am[am.length - 2], b = am[am.length - 1];
    var dt = (new Date(b.t) - new Date(a.t)) / 3600000;
    var d = (b.manifesto || 0) - (a.manifesto || 0);
    if (dt <= 0 || dt > 3 || d < 0) {
      return base + '<p class="sub">Sem leitura recente — a última amostra tem '
        + 'mais de 3 h, e este medidor só vale para intervalos curtos.</p>';
    }
    // 240 consultas/hora = um aparelho em primeiro plano; 30 = um em segundo.
    var lo = d / 240 / dt, hi = d / 30 / dt;
    return base
      + '<div class="caixa agora">'
      + '<div class="kpi-n">' + dec(lo) + '–' + dec(hi) + '</div>'
      + '<div class="kpi-r">aparelhos com o app aberto nesta hora (estimativa)</div>'
      + '</div>'
      + '<div class="nota">Não é um farol: é o próprio OTA. Um app aberto '
      + 'consulta o manifesto 240×/hora em primeiro plano e 30×/hora em segundo, '
      + 'e não há como separar os dois deste lado — daí o intervalo. <b>Inclui '
      + 'o uso próprio</b> e as consultas do CI quando ele publica.</div>';
  }

  // ===================================================================
  // O GRÁFICO DE LINHAS — SVG à mão
  // ===================================================================
  function linhas(series) {
    // A LARGURA DO viewBox ACOMPANHA A TELA: no celular o gráfico é desenhado
    // em 360 unidades (~1 unidade por pixel), senão o texto de 11 do SVG
    // encolheria para 5 px na escala de 720. No computador ele usa 720.
    var W = (window.innerWidth < 640) ? 360 : 720;
    var L = 36, R = 14, T = 12, B = 26, H = 240;
    var rot = [];
    series.forEach(function (s) { s.pts.forEach(function (p) { rot.push(p.d); }); });
    var dias = Array.from(new Set(rot)).sort();
    if (dias.length < 2) {
      return '<p class="sub" style="padding:.6rem .3rem">'
        + 'Um dia de dados só — a diferença entre dias é o que este gráfico desenha, '
        + 'então ele aparece a partir da segunda diária.</p>';
    }
    var max = 0;
    series.forEach(function (s) {
      s.pts.forEach(function (p) { if (p.v !== null && p.v > max) max = p.v; });
    });
    max = Math.max(max, 1);
    var passo = Math.pow(10, Math.floor(Math.log10(max)));
    var teto = Math.ceil(max / passo) * passo;

    var x = function (i) { return L + (W - L - R) * (i / (dias.length - 1)); };
    var y = function (v) { return T + (H - T - B) * (1 - v / teto); };

    var o = ['<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="'
      + esc(series.map(function (s) { return s.nome; }).join(', ')) + ' por dia">'];

    [0, 0.5, 1].forEach(function (f) {
      var v = teto * f, yy = y(v);
      o.push('<line x1="' + L + '" x2="' + (W - R) + '" y1="' + yy + '" y2="' + yy
        + '" stroke="var(--rule)" stroke-width="1"/>');
      o.push('<text x="' + (L - 6) + '" y="' + (yy + 4) + '" text-anchor="end" '
        + 'font-size="11" fill="var(--muted)">' + Math.round(v) + '</text>');
    });
    // RÓTULOS DE DATA EM PASSOS IGUAIS, com o último SEMPRE incluído: o
    // "um a cada N" pulava o penúltimo e o último caíam juntos no mesmo pixel.
    var quantos = Math.min(6, dias.length);
    for (var k = 0; k < quantos; k++) {
      var i = quantos === 1 ? 0 : Math.round(k * (dias.length - 1) / (quantos - 1));
      o.push('<text x="' + x(i) + '" y="' + (H - 6) + '" text-anchor="middle" '
        + 'font-size="11" fill="var(--muted)">' + diaBr(dias[i]) + '</text>');
    }

    series.forEach(function (s) {
      var mapa = {};
      s.pts.forEach(function (p) { mapa[p.d] = p.v; });
      // BURACO É BURACO: um dia sem amostra (ou contador recriado) parte a
      // linha; interpolar afirmaria uma medição que não houve.
      var seg = [], atual = [];
      dias.forEach(function (dd, i) {
        var v = mapa[dd];
        if (v === undefined || v === null) { if (atual.length) { seg.push(atual); atual = []; } return; }
        atual.push([x(i), y(v), v, dd]);
      });
      if (atual.length) seg.push(atual);

      seg.forEach(function (g) {
        if (g.length > 1) {
          o.push('<path d="M' + g.map(function (p) { return p[0] + ' ' + p[1]; }).join('L')
            + '" fill="none" stroke="' + s.cor + '" stroke-width="2" '
            + 'stroke-linejoin="round" stroke-linecap="round"/>');
        }
        g.forEach(function (p) {
          o.push('<circle cx="' + p[0] + '" cy="' + p[1] + '" r="' + (g.length === 1 ? 4 : 3)
            + '" fill="' + s.cor + '" stroke="var(--panel)" stroke-width="2"/>');
        });
      });
    });

    // camada de toque: uma faixa por dia, maior que a marca
    dias.forEach(function (dd, i) {
      var larg = (W - L - R) / Math.max(dias.length - 1, 1);
      var dica = [diaBr(dd)];
      series.forEach(function (s) {
        var p = s.pts.filter(function (q) { return q.d === dd; })[0];
        dica.push(s.nome + ': ' + (p && p.v !== null ? p.v : '—'));
      });
      o.push('<rect x="' + (x(i) - larg / 2) + '" y="' + T + '" width="' + larg
        + '" height="' + (H - T - B) + '" fill="transparent" class="alvo" '
        + 'data-dica="' + esc(dica.join(' · ')) + '"/>');
    });

    o.push('</svg>');
    return '<figure>' + o.join('')
      + '<figcaption>Cada ponto é a diferença do contador em relação ao dia anterior.'
      + '</figcaption></figure>';
  }

  function tabela(dias, porDia, baix, apar, visi) {
    var mB = {}, mA = {}, mV = {};
    baix.forEach(function (p) { mB[p.d] = p.v; });
    apar.forEach(function (p) { mA[p.d] = p.v; });
    visi.forEach(function (p) { mV[p.d] = p.v; });
    var l = ['<details><summary>Ver a tabela</summary><div class="tw"><table>',
      '<thead><tr><th>Dia</th><th>Baixaram</th><th>Usaram</th><th>Visitaram</th>',
      '<th>Farol (acum.)</th><th>Visitas (acum.)</th></tr></thead><tbody>'];
    dias.slice().reverse().forEach(function (dd) {
      var a = porDia[dd];
      l.push('<tr><td>' + esc(dd) + '</td>'
        + '<td>' + (mB[dd] === undefined || mB[dd] === null ? '—' : mB[dd]) + '</td>'
        + '<td>' + (mA[dd] === undefined || mA[dd] === null ? '—' : mA[dd]) + '</td>'
        + '<td>' + (mV[dd] === undefined || mV[dd] === null ? '—' : mV[dd]) + '</td>'
        + '<td>' + num(a.farol) + '</td><td>' + num(a.visita) + '</td></tr>');
    });
    l.push('</tbody></table></div></details>');
    return l.join('');
  }

  // ---------- a dica que segue o dedo/ponteiro ----------
  function ligarDica() {
    pagEl.addEventListener('pointerover', function (e) {
      var alvo = e.target.closest && e.target.closest('.alvo');
      if (!alvo) return;
      dicaEl.textContent = alvo.getAttribute('data-dica') || '';
      dicaEl.style.opacity = '1';
    });
    pagEl.addEventListener('pointermove', function (e) {
      if (dicaEl.style.opacity !== '1') return;
      var x = Math.min(e.clientX + 14, innerWidth - dicaEl.offsetWidth - 8);
      dicaEl.style.left = Math.max(8, x) + 'px';
      dicaEl.style.top = Math.max(8, e.clientY - dicaEl.offsetHeight - 12) + 'px';
    });
    pagEl.addEventListener('pointerout', function (e) {
      if (e.target.closest && e.target.closest('.alvo')) dicaEl.style.opacity = '0';
    });
  }
})();
</script>
</body>
</html>
