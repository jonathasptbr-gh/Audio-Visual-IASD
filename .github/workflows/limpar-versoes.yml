# O RITUAL DE LIMPEZA DA 1.0 — apaga as Releases e tags do esquema antigo.
#
# Ele existe porque a numeração anterior consumiu `v1.0`→`v1.99` e `v2.0`→`v2.4`
# (103 tags, todas com Release publicada) e a 1.0 pública precisa do nome de
# volta. É um arquivo para EXCLUIR depois de usado: um workflow que apaga
# Releases não tem por que continuar no repositório quando o ritual terminar.
#
# POR QUE ANTES DE PUBLICAR A `v1.0`, e não depois: enquanto a `v1.0` nova e a
# `v2.4` antiga coexistirem, `gh release view` sem tag devolve o que a API
# considera *latest* — e é dele que o `web-ota` tira o bloco `shell` do
# manifesto. Publicar primeiro é anunciar o APK ERRADO para a frota inteira.
#
# ELE NUNCA TOCA EM `web-latest`. Aquela release é o canal OTA, a URL está
# COMPILADA no shell (`WebUpdater.REPO`), e apagá-la mata a atualização da base
# web de todo aparelho instalado — para sempre, sem sinal, e sem como
# republicá-la a não ser rodando o `web-ota` de novo. A exclusão é explícita em
# dois pontos abaixo, de propósito: uma guarda só é uma guarda que alguém apaga.
name: Limpar versões antigas

on:
  workflow_dispatch:
    inputs:
      confirmar:
        description: 'Digite APAGAR para confirmar (qualquer outra coisa só LISTA)'
        required: true
        default: ''
      manter:
        description: 'Tags a preservar, separadas por espaço (além de web-latest)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: limpar-versoes
  cancel-in-progress: false

jobs:
  limpar:
    runs-on: ubuntu-latest
    steps:
      # `fetch-depth: 0` para o `git push --delete` ter as refs de tag na mão.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Levantar o que existe
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # A LISTA SAI DA API, não do clone: uma Release pode existir sem a tag
          # correspondente ter vindo no fetch, e é justamente ela que ficaria
          # órfã se só as tags fossem apagadas.
          gh release list --repo "$GITHUB_REPOSITORY" --limit 500 \
            --json tagName --jq '.[].tagName' | sort -V > todas.txt
          echo "Releases no repositório: $(wc -l < todas.txt)"

      - name: Escolher o que apagar
        env:
          MANTER: ${{ github.event.inputs.manter }}
        run: |
          set -euo pipefail
          : > alvos.txt
          while IFS= read -r tag; do
            # web-latest PRIMEIRO, antes de qualquer outra regra.
            [ "$tag" = "web-latest" ] && continue
            # Só o esquema `vN…`: uma tag que não case com isso não é deste
            # ritual, e recusar é mais barato que explicar depois.
            case "$tag" in v[0-9]*) ;; *) continue ;; esac
            preservar=0
            for m in $MANTER; do [ "$tag" = "$m" ] && preservar=1; done
            [ "$preservar" = "1" ] && continue
            echo "$tag" >> alvos.txt
          done < todas.txt
          echo "A apagar: $(wc -l < alvos.txt)"
          {
            echo "### Limpeza de versões"
            echo
            echo "- Releases existentes: **$(wc -l < todas.txt)**"
            echo "- Selecionadas para apagar: **$(wc -l < alvos.txt)**"
            echo "- Preservadas: \`web-latest\`${MANTER:+, \`$MANTER\`}"
          } >> "$GITHUB_STEP_SUMMARY"

      # SEM CONFIRMAÇÃO O JOB TERMINA AQUI, e VERDE: listar o que seria apagado
      # é o uso normal deste arquivo, e pintar de vermelho um ensaio ensinaria a
      # ignorar vermelho.
      - name: Ensaio (sem confirmação)
        if: github.event.inputs.confirmar != 'APAGAR'
        run: |
          set -euo pipefail
          echo "ENSAIO — nada foi apagado. Rode de novo com confirmar=APAGAR."
          sed 's/^/  · /' alvos.txt
          {
            echo
            echo '> **Ensaio.** Nada foi apagado. Rode de novo com `confirmar=APAGAR`.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Apagar
        if: github.event.inputs.confirmar == 'APAGAR'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          n=0
          while IFS= read -r tag; do
            # A MESMA GUARDA, DE NOVO. Ela não é redundante: entre a seleção e
            # este laço há um arquivo intermediário, e é exatamente o tipo de
            # costura em que um alvo errado entra sem ninguém ver.
            if [ "$tag" = "web-latest" ]; then
              echo "::error::web-latest chegou à lista de exclusão — abortando."
              exit 1
            fi
            echo "apagando $tag…"
            # `--cleanup-tag` apaga a tag junto. Sem ele a Release some e a tag
            # fica, o que é o pior dos dois mundos: o nome continua ocupado.
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
            n=$((n+1))
          done < alvos.txt
          echo "$n release(s) apagada(s)."
          echo "- **$n** release(s) e tag(s) apagadas." >> "$GITHUB_STEP_SUMMARY"

      # Tag SEM Release não aparece no `gh release list`, então o laço acima não
      # a alcança. Ela é resto de um `git push --tags` cujo workflow falhou
      # antes de publicar — e continua ocupando o nome, que é a única coisa que
      # este ritual quer de volta.
      - name: Varrer tags órfãs (sem Release)
        if: github.event.inputs.confirmar == 'APAGAR'
        env:
          MANTER: ${{ github.event.inputs.manter }}
        run: |
          set -euo pipefail
          git fetch --tags --force --quiet
          n=0
          for tag in $(git tag -l 'v[0-9]*' | sort -V); do
            [ "$tag" = "web-latest" ] && continue
            preservar=0
            for m in $MANTER; do [ "$tag" = "$m" ] && preservar=1; done
            [ "$preservar" = "1" ] && continue
            echo "tag órfã: $tag"
            git push --delete origin "$tag" --quiet || true
            n=$((n+1))
          done
          echo "$n tag(s) órfã(s) apagada(s)."
          echo "- **$n** tag(s) órfã(s) (sem Release) apagadas." >> "$GITHUB_STEP_SUMMARY"
