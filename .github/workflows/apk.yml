name: Build APK

on:
  push:
    branches: [main, 'claude/**']
    tags: ['v*']
  pull_request:
    branches: [main]
  # A RELEASE SAINDO É UM GATILHO DO CANAL OTA (v5.234).
  #
  # Quando o lote declara `shellTag` em `version.json`, o `web-ota` do push em
  # main SEGURA a publicação: um bundle que pressupõe um shell que ainda não
  # existe é exatamente a janela que este lote fecha. Quem a reabre é a Release
  # — e ela chega minutos depois, por um disparo manual, num evento que este
  # workflow não escutava. Sem esta linha o operador teria de lembrar de
  # re-executar o job à mão, que é a mesma classe de "atualização que depende de
  # alguém lembrar" que o recurso inteiro existe para acabar.
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Publicar Release com esta tag (ex: v1.1). Vazio = só compila.'
        required: false
        default: ''
      retag:
        description: 'Se a tag já existir, MOVER para o commit atual (apaga e recria a Release)'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

env:
  # Publicar uma Release: por tag `v*` ou por disparo manual com release_tag.
  PUBLISH: ${{ startsWith(github.ref, 'refs/tags/v') || github.event.inputs.release_tag != '' }}

jobs:
  # Publica a base web como bundle OTA: um push em `main` chega sozinho aos
  # aparelhos, sem APK novo (ver WebUpdater.kt). O APK continua trazendo a
  # mesma base embutida, que é o fallback offline e o piso de versão.
  web-ota:
    # Push/dispatch em main, OU uma Release recém-publicada — e nunca a própria
    # `web-latest`, senão a publicação deste job dispararia este job (a action
    # emite `edited` ao atualizar uma release existente, mas na PRIMEIRA vez ela
    # a cria, e aí o evento é `published`). O guarda é explícito porque um laço
    # de CI que se auto-alimenta não é o tipo de coisa que se descobre lendo.
    if: >-
      github.ref == 'refs/heads/main' ||
      (github.event_name == 'release' && github.event.release.tag_name != 'web-latest')
    runs-on: ubuntu-latest
    # Um grupo só, SEM cancelamento: os dois assets da release `web-latest`
    # (o zip e o version.json que carrega o sha256 dele) são substituídos um a
    # um, sem transação. Duas execuções em paralelo — o merge da branch seguido
    # de um push de correção é o caso normal — podem intercalar e deixar lá o
    # zip de uma com o sha256 da outra; a partir daí todo aparelho baixa,
    # confere o hash, e o OTA fica INERTE até o próximo push em main, sem
    # nenhum sinal (o checkAsync engole tudo em Log.i). Cancelar no meio do
    # upload produziria exatamente o mesmo estado, por isso a fila espera.
    concurrency:
      group: web-ota
      cancel-in-progress: false
    steps:
      # No evento `release` o `github.ref` é a TAG, e o que precisa ser
      # empacotado é a base web de `main` — a mesma de onde a Release nasceu
      # (`target_commitish: main`). Sem isto o republicar do OTA sairia do
      # commit da tag, que é o mesmo conteúdo por sorte e não por construção.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'release' && 'main' || '' }}

      # O canal OTA publica direto para a frota: um erro de sintaxe aqui chega
      # aos aparelhos e o watchdog de boot NÃO evita o primeiro estrago —
      # `beginSession()` arma o pending e SERVE o bundle; só o lançamento
      # seguinte o descarta. Ou seja, um lançamento quebrado por aparelho,
      # garantido, e se for o do culto o operador fica sem sistema até fechar e
      # reabrir o app. `node --check` é a verificação mais barata que pega
      # justamente o caso letal (o `node` já vem no runner), e com
      # `set -euo pipefail` qualquer falha reprova o job ANTES de publicar.
      # Não substitui teste de comportamento — só garante que o bundle carrega.
      - name: Sanidade da base web (sintaxe do JS)
        run: |
          set -euo pipefail
          # `vendor/` fica de fora: é código buildado de terceiro (ESM), e o
          # `node --check` só o aceita pela detecção automática de módulo do
          # Node — uma regressão do runner bloquearia o canal OTA inteiro por
          # um arquivo que não é nosso.
          find app/src/main/assets/web -name '*.js' -not -path '*/vendor/*' -print0 |
            xargs -0 -n1 -t node --check
          python3 - <<'PY'
          import json, re
          m = json.load(open('app/src/main/assets/web/version.json'))
          assert m['version'] and int(m['minShell']) > 0, m
          # `shellTag` é o ACOPLAMENTO com a Release (v5.234): declarado, ele
          # segura a publicação do bundle até a Release existir. Um valor
          # malformado ("1.99" sem o v, um espaço solto) não seria erro em lugar
          # nenhum — a consulta à API devolveria 404, o job seguraria o OTA para
          # sempre, e o sintoma no aparelho seria "a atualização não chega", que
          # é o modo de falhar mais mudo que este canal tem. Por isso a forma é
          # exigida aqui, onde a mensagem ainda pode nomeá-la.
          tag = m.get('shellTag', '')
          assert isinstance(tag, str), m
          assert not tag or re.fullmatch(r'v[0-9]+(\.[0-9]+)*', tag), (
              f'shellTag malformado: {tag!r} — use o formato da tag, ex. "v2.0"')
          print('version.json OK:', m)
          PY
          # A versão mora em TRÊS lugares (ver CLAUDE.md), e os três precisam
          # bater: esquecer o WEB_VERSION é "o erro silencioso" (o OTA distribui
          # e o aparelho exibe a versão antiga) e esquecer o version.json é "o
          # erro mudo" (nada chega a aparelho nenhum). Até aqui a única defesa
          # era disciplina; este assert fecha a classe.
          python3 - <<'PY'
          import json, re
          raiz = 'app/src/main/assets/web'
          vjson = json.load(open(f'{raiz}/version.json'))['version']
          js = open(f'{raiz}/controle/controle.js', encoding='utf-8').read()
          vjs = re.search(r"^const WEB_VERSION = '([^']+)'", js, re.M).group(1)
          html = open(f'{raiz}/controle/index.html', encoding='utf-8').read()
          vhtml = re.search(r'id="appVersion"[^>]*>[^<]*?v([0-9][0-9.]*)<', html).group(1)
          assert vjson == vjs == vhtml, (
              f'os três lugares de versão divergem: version.json={vjson} '
              f'controle.js WEB_VERSION={vjs} index.html #appVersion={vhtml}')
          print('três lugares de versão OK:', vjson)
          PY
          # O parser do índice DASH (`sidx`) da transmissão direta. Ele entra
          # aqui, e não num framework de teste, porque é a ÚNICA peça daquele
          # caminho que se verifica sem aparelho — e porque um erro de
          # deslocamento nele não dá erro: dá vídeo que não toca, no telão, no
          # meio de um culto. O passo já existe para impedir que o canal OTA
          # publique um bundle que não carrega; isto é da mesma natureza.
          node tools/sidx.test.mjs
          # O CONTRATO do `shouldInterceptRequest`: o `InputStream` devolvido é
          # o recurso INTEIRO a partir do byte 0, e quem aplica o `Range` é o
          # WebView. Violar isso custou três rodadas de APK (v1.52 → v1.54) com
          # o CI verde o tempo todo — porque a camada que falha não existe fora
          # do aparelho. O oráculo transcreve a regra do Chromium e prova, em
          # Node puro, que a fatia crua NÃO atende e a faixa na URL atende.
          # Determinístico, sem rede e sem navegador: entra aqui, e sem
          # `continue-on-error`.
          node tools/webview-range.test.mjs
          node tools/contexto-seguro.test.mjs
          # A SOMBRA: nenhuma função redeclara um nome de módulo da base web.
          # `node --check` aprova `const ms = …` dentro de uma função que LÊ a
          # `ms` do módulo na primeira linha — e o resultado é
          # `ReferenceError: Cannot access 'ms' before initialization` (zona
          # morta temporal), a cada 500 ms, só nas telas do espelho que tinham
          # ligado o som. Foi assim que a v5.152 matou o laço de borda do
          # cliente (sem poda, sem perseguição, sem relato) e o sintoma chegou
          # como "travando e dessincronizando", nunca como uma exceção.
          # Determinístico, sem navegador: entra aqui, sem `continue-on-error`.
          node tools/sombra.test.mjs

          # AS DUAS METADES DO DRENO DA TELA DA REDE. A lista de permissão do
          # que uma tela pode injetar no barramento existe no `tela.js` (evita o
          # tráfego) e no `EspelhoServidor.kt` (é a que VALE) — e duas listas
          # sem oráculo divergem no primeiro esquecimento, mudas nos dois
          # sentidos. O KDoc do `TIPOS_QUE_SOBEM` afirmava que o
          # `tela-rede.test.mjs` cobrava o par; ele não cobrava — aquele oráculo
          # sobe um servidor de MENTIRA e nunca lê o Kotlin.
          node tools/tipos-que-sobem.test.mjs
          # A REGRA DA SÉRIE: quais playlists do canal formam o álbum "Provai e
          # Vede 2026" e quais vídeos entram nele. Os dois modos de errar são
          # silenciosos e caros — aceitar demais põe a versão em LIBRAS em par
          # com a de português (o álbum dobra, com o intérprete na projeção sem
          # ninguém ter pedido), e aceitar de menos apaga um MÊS inteiro da
          # Biblioteca sem erro no console. As entradas do teste são VERBATIM do
          # canal, incluindo a playlist que não tem o hífen que todas as outras
          # têm. Node puro, sem rede: sem `continue-on-error`.
          node tools/serie.test.mjs
          # A REGRA DO SORTEIO TEMÁTICO: quais faixas do acervo a "Playlist
          # automática" pode mandar ao telão. O operador toca UM botão e a faixa
          # entra em cena — não há tela intermediária e ninguém confere a lista
          # antes. Os quatro modos de errar são silenciosos: um episódio de
          # série (~300 MB) no lugar do louvor, uma faixa que casa a letra e não
          # aparece, o PLAYBACK projetado onde se esperava a voz (o
          # `resolveSongMediaId` manda para o instrumental tudo que não seja
          # `'full'`), e a fila cheia do que ainda precisa ser baixado — o culto
          # esperando a rede da igreja. Node puro, sem rede: sem
          # `continue-on-error`.
          node tools/sorteio.test.mjs
          # TODO ÍCONE DE FONTE TEM DE EXISTIR NA FONTE. O woff2 é um SUBSET de
          # 31 codepoints, e um `.msym` fora dele não desenha nada: sem erro no
          # console, sem requisição falhando, só um vão do tamanho de um ícone.
          # O botão existe, é tocável, faz o que promete — e é invisível. Foi
          # assim que a playlist automática saiu ao ar com `casino` (e30c), e
          # antes dela o `edit`, o `folder_open` e o `create_new_folder`. Ele lê
          # o `cmap` do próprio arquivo (Node puro, `zlib.brotliDecompressSync`,
          # zero dependência) e barra o build, porque um ícone invisível chega à
          # frota pelo OTA e só é descoberto por quem opera.
          node tools/glifos.test.mjs

      - name: Tokens de CSS que não existem (Node puro)
        run: |
          # Um `var(--nao-existe)` SEM fallback computa para o valor INICIAL da
          # propriedade — sem aviso no console, sem erro, sem sintoma no lugar
          # da causa. Na v5.171 isso deixou os DOIS botões principais da folha
          # "Conectar uma tela" com `border-radius: 0`, os únicos cantos retos
          # de um app inteiro arredondado, e nenhuma ferramenta reclamou.
          # Mesma família do `setInteger` numa chave `long` e do `bytes`
          # esquecido no `bgProgress`. Determinístico: sem `continue-on-error`.
          node tools/tokens.test.mjs

      # ────────────────────────────────────────────────────────────────────
      # OS ORÁCULOS DE CHROMIUM, EM DOIS PASSOS (v5.213)
      #
      # Eram um só, e o arranjo tinha um defeito que o painel verde escondia:
      # `set -euo pipefail` com os testes em sequência faz o PRIMEIRO que
      # reprovar abortar os ONZE seguintes. Somado ao `continue-on-error`, o
      # desfecho era "um teste caiu, os outros nunca rodaram, e o run está
      # verde" — e descobrir isso exigia abrir o log e reparar em qual linha
      # ele parou. Um teste que não é lido não é rede de segurança; um teste
      # cujo RESULTADO não é lido também não.
      #
      # A separação não é organização: ela é o que dá sentido ao
      # `continue-on-error`. A justificativa dele sempre foi INFRAESTRUTURA
      # (download do Chromium, runner sem rede), e infraestrutura agora é o
      # passo de baixo, sozinho. O passo dos testes ficou com uma causa só de
      # falhar — defeito de verdade —, roda todos eles SEMPRE (nenhum aborta o
      # próximo), emite `::error::` por reprovado e escreve o placar no resumo
      # do run, onde se lê sem abrir log nenhum.
      #
      # Ele SEGUE com `continue-on-error`, e isso é a política do projeto
      # intacta, não esquecimento: barrar o canal OTA por um teste de navegador
      # continua sendo trocar um risco raro por um bloqueio frequente. O que
      # mudou é que agora essa escolha é uma linha só — e a razão que a
      # sustentava mudou de endereço.
      # ────────────────────────────────────────────────────────────────────
      # ---------- E ELE TEM PRAZO ----------
      # `continue-on-error` protege contra FALHAR, não contra TRAVAR — e os dois
      # não são o mesmo evento neste job. Medido: na v5.302 este passo ficou
      # **43 minutos** pendurado num `npm i`/`playwright install` que não voltava,
      # foi cancelado à mão, e com ele os passos de baixo — "Empacotar a base
      # web" e o upload da Release — foram PULADOS. O bundle daquele lote nunca
      # chegou ao canal.
      #
      # E o estrago não parou nele: o `concurrency: web-ota` com
      # `cancel-in-progress: false` (que é a decisão certa, ver o comentário do
      # topo do job) segurou o lote SEGUINTE na fila os mesmos 43 minutos.
      #
      # O modo de falhar é MUDO nas duas pontas: o run não fica vermelho (o
      # `continue-on-error` o absorve) e o aparelho não tem o que mostrar — do
      # lado de quem opera, "a atualização não chega", sem nada em lugar nenhum
      # que o explique. O prazo transforma isso num passo que TERMINA: os
      # oráculos de Chromium são pulados (o `if` abaixo já cuida disso) e o
      # bundle publica, que é o que não pode faltar.
      #
      # 10 min é folga larga sobre o normal — medido em 24 s na execução seguinte.
      - name: Preparar o Chromium (infraestrutura)
        id: chromium
        continue-on-error: true
        timeout-minutes: 10
        run: |
          set -euo pipefail
          npm i --no-audit --no-fund --silent playwright
          npx playwright install --with-deps chromium

      # FUMAÇA DO CONTROLE e os demais oráculos, num Chromium de verdade. Os
      # passos acima provam que os arquivos são PARSEÁVEIS; estes provam que o
      # app SOBE e responde ao toque. A distinção não é acadêmica: a v5.121 saiu
      # com o botão de copiar o Registro chamando uma função que uma limpeza
      # tinha apagado — sintaxe perfeita, `node --check` verde, botão morto no
      # aparelho.
      #
      # `if` no resultado do passo de cima: sem Chromium instalado todos
      # falhariam por um motivo que não é deles, e uma dúzia de `::error::` de
      # infraestrutura é exatamente o ruído que ensina a ignorar vermelho.
      # PRAZO AQUI TAMBÉM, e pela mesma razão: um oráculo que pendure o
      # navegador (uma Promise que nunca resolve, um `waitForFunction` sem
      # timeout) trava o job inteiro e leva o canal OTA junto. 15 min é folga
      # sobre os ~6 que os quinze levam somados.
      - name: Oráculos em Chromium
        if: steps.chromium.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 15
        run: |
          # SEM `-e`, e é o ponto do passo: um reprovado não pode calar os que
          # vêm depois. Quem guarda o desfecho é o `rodar`.
          set -uo pipefail
          rodados=0
          falhas=()
          rodar() {
            rodados=$((rodados + 1))
            echo "::group::$1"
            if PW_CHROMIUM="" node "$1"; then
              echo "::endgroup::"
            else
              echo "::endgroup::"
              falhas+=("$1")
              echo "::error::$1 REPROVOU"
            fi
          }

          rodar tools/smoke.mjs
          # E O BOOT COMO O APP O FAZ — com a ponte presente. O `smoke.mjs`
          # acima sobe a base SEM `__AVBridge`, e por isso todo caminho guardado
          # por `window.__NATIVE__` nunca era executado por teste nenhum: são
          # justamente os que só rodam no aparelho, onde não há console para
          # olhar. A v5.195 saiu com um `const` em zona morta temporal dentro de
          # um `if (espelhoDisponivel())` — verde aqui, tela PRETA no celular, e
          # o watchdog do OTA descartando o bundle no lançamento seguinte.
          rodar tools/boot-nativo.test.mjs
          # E as MENSAGENS DE FALHA da transmissão direta. Nelas a mensagem é o
          # produto: a transmissão roda no aparelho do operador, contra URLs que
          # expiram, e a única coisa que atravessa essa distância é a linha do
          # Registro. "Não deu" já custou duas rodadas de APK aqui.
          rodar tools/mse.test.mjs
          # E a TRANSIÇÃO DE ENTRADA do palco. Ela ficou anos pela metade (a
          # mídia velha esmaecia, a nova entrava no talo) e ninguém viu, porque
          # um arquivo local vira quadro em milissegundos e o corte colava no
          # fim do esmaecimento. Só a transmissão direta — com a rede inteira
          # entre o preto e o primeiro quadro — tornou a falta visível. É um
          # defeito que nenhum `--check` pega e que a congregação inteira vê.
          rodar tools/stage-fade.test.mjs
          # E o COLETOR DE LIXO do banco, que é o único código do app que apaga
          # mídia do operador. Um erro ali não dá tela branca: some com o vídeo
          # do domingo, em silêncio e sem desfazer.
          rodar tools/db-gc.test.mjs
          # E as CONTAS DA BIBLIOTECA — "esta coleção está completa?" e "quanto
          # ela ocupa?". As duas eram respondidas por fórmulas diferentes em
          # lugares diferentes da mesma tela, e o resultado era um card com o
          # botão de baixar ao lado de um chip dizendo "Completo offline". Conta
          # errada não estoura em lugar nenhum: ela só mostra o número errado.
          rodar tools/acervo.test.mjs
          # E O QUE A PONTE DE FATO ENTREGA. `native.js` REMONTA campo a campo
          # os objetos que manda ao Kotlin, e um campo esquecido some em
          # silêncio: do outro lado, `optBoolean`/`optLong` leem ausente como
          # `false`/`0`, que são valores legítimos. Já custou duas vezes —
          # `slideLabel` (v5.97→v5.102) e `bytes`, que nunca chegou a viajar
          # desde a versão que o criou.
          rodar tools/ponte.test.mjs
          # E O TELÃO, que até agora NENHUM teste tinha carregado. A fumaça
          # acima abre o Controle; o `stage-fade` monta o palco à mão. A metade
          # que roda na frente da congregação era a metade que a CI nunca
          # executou — e é a que menos rede de segurança tem, porque o watchdog
          # do OTA também não a valida (quem confirma o bundle é o Controle).
          # Ele trava, de quebra, o endereçamento do reenvio de cena: sem ele,
          # uma segunda instância do Display faz a TV recarregar a mídia.
          rodar tools/display-smoke.mjs
          # E OS DESTINOS das folhas de escolha. O que está marcado precisa
          # ATRAVESSAR o fechamento da folha: a ação roda depois de
          # `closeSongMenu()`, que zera o conjunto, e uma leitura tarde demais
          # devolveria só a linha tocada — o item iria para um destino em vez de
          # dois, sem erro nenhum. Mesma classe de falha muda do `slideLabel`.
          rodar tools/destinos.test.mjs
          # E A PLAYLIST AUTOMÁTICA, DA FOLHA ATÉ A FILA. O `sorteio.test.mjs`
          # (Node puro, acima) trava a REGRA; este trava a LIGAÇÃO, que falha de
          # outro jeito — a regra continua certa e o recurso não faz nada. As
          # quatro capacidades injetadas (`sorteioCap`) são ponteiros para
          # funções do `controle.js`, e um errado devolve um pool plausível e
          # ERRADO; e o contador é a única coisa que o operador lê antes de um
          # botão que dispara sem mais nenhuma tela.
          rodar tools/sorteio-tela.test.mjs
          # E A CENA: o que o telão mostra ao RECONECTAR, o que o operador
          # ajusta nela (girar, preencher) e o que ele lê sobre ela. A reconexão
          # do dongle é o caminho menos testável à mão — exige TV, dongle e o
          # timing de derrubá-lo — e roda sozinho na frente da congregação.
          rodar tools/cena.test.mjs
          # E A IMAGEM SOBRE O ÁUDIO: a regra é uma AUSÊNCIA — nenhum `load`
          # sai daquele caminho, e é só por isso que o louvor de fundo
          # sobrevive ao aviso projetado por cima. Ausência não tem sintoma de
          # tela nem erro de console: quem a prova é o `currentTime` do
          # `<video>` medido em dois instantes, nas duas metades (o Controle
          # que decide sobrepor, e o telão que pinta na frente da congregação).
          rodar tools/imagem-sobre-audio.test.mjs
          # E A TELA DA REDE do telão por comandos (E3 — ver
          # docs/TELAO-POR-COMANDOS.md): o /display/ servido pelo celular
          # rodando num navegador comum, com a entrada pelo código, o dreno de
          # subida (só display-ready e tela-status sobem), a correção de
          # relógio anulando 90 s de desvio, a reconexão que se reapresenta e
          # o adeus que não martela. Teste fora do workflow é documentação —
          # a lição da v5.145 (três testes escritos e ligados em lugar nenhum).
          rodar tools/tela-rede.test.mjs
          # E O REGISTRO — o único artefato do app cujo consumidor é um HUMANO A
          # DISTÂNCIA. Todo o resto falha na frente de quem pode ver; ele falha
          # CONTINUANDO A RESPONDER, com uma frase errada, e quem a lê vai
          # investigar o que ela diz. Nenhum teste o carregava até a v5.206, e
          # foi por aí que passaram três defeitos ao mesmo tempo: o `ritmo`
          # zerado imprimindo "ALARME: ISTO É UM RETÂNGULO PRETO" em todo culto,
          # toda tela conectada sendo acusada de rodar "bundle antigo", e um
          # "modo: imagem (JPEG)" de um modo removido dez versões antes. Os três
          # têm a mesma forma — um consumidor que sobreviveu ao produtor lê o
          # valor ausente como se fosse resposta.
          rodar tools/registro.test.mjs
          # E O FLUXO DE ATUALIZAÇÃO, que é o único caminho do app cujo defeito
          # NÃO TEM SINTOMA: quando a atualização não chega, nada quebra e nada
          # erra alto — o operador só continua na versão de anteontem sem saber.
          # Foi assim por dezenas de versões, e a v5.151 chegou a REMOVER a
          # pergunta por concluir que ela "nunca aparecia" (era o espelho ligado
          # suprimindo o diálogo, e isso levou meses para ser identificado).
          # Nenhum teste tocava neste código: o `smoke.mjs` sobe sem ponte e
          # todo o bloco é `window.__NATIVE__`; o `boot-nativo` prova o boot,
          # não o fluxo. Ele entra no workflow no MESMO commit em que nasce —
          # a lição da v5.145.
          rodar tools/ota.test.mjs

          # O PLACAR VAI PARA O RESUMO DO RUN, não só para o log — a queixa que
          # originou este lote foi precisamente que o desfecho só existia lá
          # dentro. `rodados` é CONTADO, nunca digitado: um número fixo aqui
          # envelheceria no primeiro oráculo novo, e envelheceria mentindo.
          passaram=$((rodados - ${#falhas[@]}))
          echo "Oráculos em Chromium: $passaram/$rodados passaram." | tee -a "$GITHUB_STEP_SUMMARY"
          if [ ${#falhas[@]} -gt 0 ]; then
            printf 'REPROVOU: %s\n' "${falhas[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      # O PULO TAMBÉM VAI PARA O RESUMO. Sem este passo, um `Preparar o
      # Chromium` que falhe ou estoure o prazo deixava os quinze oráculos de
      # fora SEM UMA LINHA em lugar nenhum: o resumo do run ficava idêntico ao
      # de uma execução em que tudo passou, e o bundle publicava do mesmo jeito.
      # É a mesma classe do incidente da v5.302, e a metade dele que o prazo não
      # cobriu — o prazo impede TRAVAR, não impede o SILÊNCIO.
      #
      # Não reprova o job de propósito: a política de `continue-on-error` deste
      # passo é deliberada (barrar o canal OTA por um teste de navegador é
      # trocar um risco raro por um bloqueio frequente). O que muda é que a
      # ausência do placar deixa de ser indistinguível de "15/15".
      - name: Oráculos em Chromium — PULADOS (aviso)
        if: steps.chromium.outcome != 'success'
        run: |
          echo "::warning::Oráculos em Chromium PULADOS — 'Preparar o Chromium' terminou como '${{ steps.chromium.outcome }}'"
          echo "Oráculos em Chromium: 0/15 — **PULADOS** (infraestrutura: \`Preparar o Chromium\` terminou como \`${{ steps.chromium.outcome }}\`). O bundle publica assim mesmo; nenhum oráculo de navegador foi consultado neste run." >> "$GITHUB_STEP_SUMMARY"

      # ────────────────────────────────────────────────────────────────────
      # A RELEASE QUE ESTE LOTE EXIGE (v5.234)
      #
      # Até aqui os dois canais eram independentes e o push em main publicava o
      # bundle na hora. Quando o lote mexia no Kotlin, todo aparelho recebia web
      # NOVO com shell VELHO por horas ou dias — e a única defesa era `minShell`,
      # que este projeto mantém em 2 de propósito (subi-lo recusaria a
      # atualização inteira em quem estivesse atrasado). O operador via metade
      # do lote funcionando e metade não, sem nada que explicasse a diferença.
      #
      # Agora `shellTag` no `version.json` do repositório declara a dependência,
      # e este passo é o portão: sem a Release publicada, o bundle NÃO sai. O
      # job termina VERDE, porque isto não é falha — é o estado normal entre o
      # merge e o disparo da Release, e pintá-lo de vermelho ensinaria a ignorar
      # vermelho (a lição da v5.204).
      #
      # Havendo a Release, o manifesto sai com o bloco `shell`, e é dele que o
      # aparelho tira o link do APK: uma tela só, uma decisão só, e ZERO
      # consultas à API do GitHub na ronda rápida — que é o que permite a ronda
      # ser rápida sem estourar o limite de 60 requisições por hora.
      # ────────────────────────────────────────────────────────────────────
      - name: A Release que este lote exige
        id: shell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=$(python3 -c "import json;print(json.load(open('app/src/main/assets/web/version.json')).get('shellTag',''))")
          # `|| true` porque um 404 é resposta esperada (a Release ainda não
          # saiu), e com `set -e` ele abortaria o job com cara de defeito.
          EXIGIDA=$([ -n "$TAG" ] && echo sim || echo nao)
          if [ -n "$TAG" ]; then
            echo "Este lote EXIGE a Release $TAG."
            REL=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
                    --json tagName,assets 2>/dev/null || true)
            if [ -z "$REL" ]; then
              echo "SEGURANDO O OTA: a Release $TAG ainda não existe." \
                | tee -a "$GITHUB_STEP_SUMMARY"
              echo "O bundle sairá sozinho quando ela for publicada (gatilho \`release\`)." \
                >> "$GITHUB_STEP_SUMMARY"
              echo "HOLD=true" >> "$GITHUB_ENV"
              exit 0
            fi
          else
            # SEM `shellTag` O MANIFESTO AINDA ANUNCIA O APK MAIS RECENTE, e
            # isto não é zelo: é o buraco que a primeira versão deste passo
            # deixou aberta. `shellTag` responde "este lote PRECISA de uma
            # Release?" — e uma Release publicada sem que a base web mudasse
            # (uma correção só de Kotlin) não a declara em lugar nenhum. Sem
            # esta metade, esse APK nunca seria anunciado a aparelho nenhum e o
            # operador voltaria a caçá-lo no navegador, que é exatamente o
            # atrito que este lote existe para acabar.
            #
            # `gh release view` sem tag devolve a "latest" da API, que ignora
            # prereleases — ou seja, a `web-latest` fica de fora por
            # construção, sem precisar de filtro.
            echo "Sem shellTag: nada a segurar. Anunciando a Release mais recente, se houver."
            REL=$(gh release view --repo "$GITHUB_REPOSITORY" \
                    --json tagName,assets 2>/dev/null || true)
            if [ -z "$REL" ]; then
              echo "Nenhuma Release publicada ainda: OTA puro."
              echo "SHELL_JSON=" >> "$GITHUB_ENV"
              exit 0
            fi
            TAG=$(printf '%s' "$REL" | python3 -c "import json,sys;print(json.load(sys.stdin)['tagName'])")
          fi
          SHELL_JSON=$(python3 - "$REL" "$TAG" <<'PY'
          import json, sys
          rel, tag = sys.argv[1], sys.argv[2]
          o = json.loads(rel)
          apk = next((a for a in o.get('assets', [])
                      if a.get('name', '').lower().endswith('.apk')), None)
          if not apk:
              # A Release existe e não tem APK: publicar o bundle apontando para
              # um shell que ninguém consegue instalar seria pior que segurar.
              print('SEM_APK'); raise SystemExit(0)
          print(json.dumps({
              'versao': tag.lstrip('vV'),
              'apk': apk['url'],
              'bytes': int(apk.get('size') or 0),
          }, separators=(',', ':')))
          PY
          )
          if [ "$SHELL_JSON" = "SEM_APK" ]; then
            # A ASSIMETRIA É A DECISÃO. Uma Release EXIGIDA que ainda não tem
            # `.apk` é a corrida normal entre a criação da Release e o upload do
            # binário — segurar é o certo, e o gatilho `release` (que dispara
            # com o arquivo já anexado) resolve sozinho. Já uma Release
            # qualquer sem `.apk` não tem nada a ver com este bundle: bloquear o
            # canal OTA inteiro por causa dela seria deixar a base web presa por
            # um evento que não é dela.
            if [ "$EXIGIDA" = "sim" ]; then
              echo "SEGURANDO O OTA: a Release $TAG existe mas ainda não tem .apk." \
                | tee -a "$GITHUB_STEP_SUMMARY"
              echo "HOLD=true" >> "$GITHUB_ENV"
            else
              echo "A Release $TAG não tem .apk — publicando sem o bloco shell."
              echo "SHELL_JSON=" >> "$GITHUB_ENV"
            fi
            exit 0
          fi
          echo "Release $TAG encontrada: $SHELL_JSON"
          echo "SHELL_JSON=$SHELL_JSON" >> "$GITHUB_ENV"

      - name: Empacotar a base web
        if: env.HOLD != 'true'
        run: |
          set -euo pipefail
          SRC="$GITHUB_WORKSPACE/app/src/main/assets/web/version.json"
          VERSION=$(python3 -c "import json;print(json.load(open('$SRC'))['version'])")
          # O NOME DO ZIP CARREGA A VERSÃO, e isso não é cosmético.
          #
          # Ele era `web-assets.zip`, SUBSTITUÍDO no lugar a cada publicação —
          # e o próprio comentário do `concurrency` acima já reconhecia o
          # desfecho: duas execuções intercaladas deixam o zip de uma com o
          # sha256 da outra, e a partir daí **todo aparelho baixa, confere o
          # hash, reprova e o OTA fica INERTE até o próximo push**, sem sinal
          # nenhum. A fila reduzia a chance; ela não fechava a classe, porque
          # nada impede a fila de ser furada por um `retag` ou por uma execução
          # que morra entre os dois uploads. Um nome imutável por versão fecha:
          # o zip da versão N nunca é sobrescrito, então um manifesto que fale
          # da versão N sempre encontra o zip da versão N. De quebra, some a
          # janela em que um cache intermediário pode devolver o zip de ontem
          # no endereço de hoje.
          ZIP="$GITHUB_WORKSPACE/web-$VERSION.zip"
          META="$GITHUB_WORKSPACE/version.json"

          # O zip preserva o prefixo `web/` para que o caminho dentro do
          # bundle bata 1:1 com a URL servida pelo asset loader.
          rm -f "$ZIP"
          (cd "$GITHUB_WORKSPACE/app/src/main/assets" && zip -qr "$ZIP" web)

          SHA=$(sha256sum "$ZIP" | cut -d' ' -f1)

          python3 - "$SRC" "$META" "$SHA" "$GITHUB_REPOSITORY" "$(basename "$ZIP")" <<'PY'
          import json, os, sys
          src, out, sha, repo, nome = sys.argv[1:6]
          meta = json.load(open(src))
          saida = {
              "version": meta["version"],
              "minShell": int(meta["minShell"]),
              "sha256": sha,
              "assets": f"https://github.com/{repo}/releases/download/web-latest/{nome}",
          }
          # O BLOCO `shell` É O RECADO PARA O APARELHO: "esta base web vem com um
          # APK, e ele está aqui". Sem ele o app trata a atualização como OTA
          # puro — que é o caso comum e continua funcionando igual.
          bruto = os.environ.get("SHELL_JSON", "").strip()
          if bruto:
              saida["shell"] = json.loads(bruto)
          json.dump(saida, open(out, "w"), indent=2)
          PY

          echo "Bundle: $(du -h "$ZIP" | cut -f1)"
          cat "$META"
          echo "ZIP_NOME=$(basename "$ZIP")" >> "$GITHUB_ENV"

      # Tag fixa: a URL do `version.json` precisa ser estável, porque está
      # compilada no shell. O ZIP, não — ele é encontrado PELO manifesto, e por
      # isso pode (e deve) ter nome versionado. Ou seja, o único arquivo
      # substituído no lugar passa a ser o manifesto, que é minúsculo, tem
      # `?t=` anti-cache do lado do app e é escrito por ÚLTIMO: mesmo uma
      # publicação interrompida no meio deixa o estado anterior íntegro, em vez
      # de um sha órfão.
      - uses: softprops/action-gh-release@v2
        if: env.HOLD != 'true'
        with:
          tag_name: web-latest
          name: Base web (canal OTA)
          prerelease: true
          files: |
            ${{ env.ZIP_NOME }}
            version.json
          body: |
            **Infraestrutura — não é para instalar.**

            Canal de atualização da base web: o app consulta o `version.json`
            aqui e baixa o `web-<versão>.zip` que ele apontar. Os APKs para
            instalar estão nas releases `v*`.

      # Com nome versionado os zips ACUMULAM, e um asset de release não é
      # recolhido por ninguém. Ficam os três mais novos: o servido, o que acabou
      # de sair e uma folga para o aparelho que estava baixando o anterior no
      # instante da publicação — apagar o que alguém está baixando devolveria um
      # 404 no meio do download, que é justamente o tipo de falha intermitente
      # que este lote existe para acabar.
      - name: Recolher bundles antigos
        if: env.HOLD != 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view web-latest --repo "$GITHUB_REPOSITORY" --json assets \
            --jq '.assets[] | select(.name | test("^web-.*\\.zip$")) | .name' \
            | sort -V -r | tail -n +4 | while read -r velho; do
              echo "recolhendo $velho"
              gh release delete-asset web-latest "$velho" \
                --repo "$GITHUB_REPOSITORY" --yes || true
            done

  apk:
    # No evento `release` não há APK a construir: a Release ACABOU de publicar
    # um. Rodar aqui recompilaria o mesmo commit para jogar o resultado fora —
    # e, pior, o `PUBLISH` daria falso (não é tag nem dispatch), então sairia um
    # build de debug consumindo minutos de runner por nada.
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    steps:
      # `fetch-depth: 0` porque o versionCode sai da CONTAGEM DE COMMITS (ver
      # "Definir versão"), e um clone raso devolveria 1.
      # `ref`: num disparo manual COM release_tag, o código vem de `main` — a
      # tag/Release também nasce lá (target_commitish), e sem isto o APK podia
      # ser compilado de uma branch `claude/**` (que o `on.push` permite)
      # enquanto a tag apontava para main: binário publicado ≠ commit da tag.
      # Vazio = comportamento padrão da action (o próprio ref do evento), que é
      # o certo para push de tag, push de branch e PR.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.release_tag != '' && 'main' || '' }}

      # O runner ubuntu-latest já traz o Android SDK e o JDK — nenhuma
      # infraestrutura externa é necessária para gerar o APK.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Permissão de execução do wrapper
        run: chmod +x ./gradlew

      # OS TESTES UNITÁRIOS EM JVM, E SEM `continue-on-error`.
      #
      # Este passo existe por um arquivo e meio: o `EspelhoHttp.kt` e o
      # `EspelhoPares.kt` (espelho de pixels — ver docs/ESPELHO-DE-PIXELS.md) são
      # o ÚNICO código do projeto que encara a rede. Tudo o mais que entra no app
      # vem do operador (SAF, compartilhamento) ou de uma URL que o próprio app
      # cunhou; ali entra o que um desconhecido na rede da igreja mandar. E é o
      # único código em que um erro não vira pixel errado: vira controle de acesso
      # quebrado — um parser que se perde no `read()` parcial, um teto que não
      # segura, um 404 que responde diferente conforme o que existe atrás dele.
      #
      # É também o único que TEM oráculo sem aparelho: os dois arquivos são puros
      # (zero import de android.*) e recebem o relógio por parâmetro, então prazo
      # de seis horas e bloqueio de um minuto se verificam em milissegundos. O
      # documento que desenhou o espelho recusou o RFC 6455 por ser "protocolo sem
      # oráculo" — escrever um parser HTTP com autenticação sem teste seria o mesmo
      # argumento aplicado contra ele mesmo (a justificativa inteira, como QUARTA
      # EXCEÇÃO à regra de zero dependência, está no `dependencies` do
      # app/build.gradle.kts).
      #
      # Sem `continue-on-error`, ao contrário dos testes de Chromium: aqui não há
      # download de navegador nem rede para falhar por infraestrutura — é Kotlin
      # puro no JDK que o runner já tem. Uma falha aqui é defeito, e um defeito
      # nesta camada não pode virar APK.
      - name: Testes unitários (JVM)
        run: ./gradlew --no-daemon testDebugUnitTest

      # A versão sai da tag (v1.1 → versionName 1.1). O versionCode NÃO sai
      # mais do número da execução: `github.run_number` conta por WORKFLOW, e
      # renomear o `apk.yml` (ou trocar o `name:`) reinicia a contagem em 1 —
      # o versionCode despencaria e o Android recusaria a instalação por cima
      # (INSTALL_FAILED_VERSION_DOWNGRADE), forçando desinstalar, que é a perda
      # de IndexedDB/OPFS que a keystore fixa existe para evitar. A contagem de
      # commits é monotônica de verdade e independe do nome do workflow. O
      # deslocamento de 100000 existe só para o primeiro APK desta regra ficar
      # ACIMA do último publicado pela regra antiga (o Android exige que o
      # versionCode apenas CRESÇA, e a contagem de commits pode ser menor que o
      # run_number acumulado): se algum dia um versionCode já publicado chegar
      # perto dele, aumente o deslocamento — nunca o diminua.
      - name: Definir versão
        env:
          RELEASE_TAG: ${{ github.event.inputs.release_tag }}
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            TAG="$RELEASE_TAG"
          elif [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG=""
          fi
          if [ -n "$TAG" ]; then
            echo "APK_NAME=$TAG" >> "$GITHUB_ENV"
            echo "VERSION_NAME=${TAG#v}" >> "$GITHUB_ENV"
          else
            echo "APK_NAME=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
            echo "VERSION_NAME=0.0-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          fi
          echo "VERSION_CODE=$((100000 + $(git rev-list --count HEAD)))" >> "$GITHUB_ENV"

      # Só quando NÃO é publicação: numa Release o APK que sai é o da variante
      # release (passo abaixo), e o de debug era compilado e jogado fora —
      # minutos de runner por um arquivo que ninguém usava. O "Nomear o APK"
      # já escolhe a fonte pelo mesmo PUBLISH, então nenhum fluxo fica sem
      # arquivo.
      - name: Build (debug)
        if: env.PUBLISH != 'true'
        run: ./gradlew --no-daemon assembleDebug

      # Assinado com a keystore fixa quando os secrets existem — é o que
      # permite atualizar por cima sem desinstalar (e sem perder a biblioteca
      # do app: Cronograma, pastas sincronizadas, hinos e Bíblia baixados).
      # `-PrequireSigning=true` faz o PRÓPRIO Gradle reprovar a falta da chave:
      # é ele quem sabe se ela existe. Fora daqui (build local, PR de terceiro,
      # clone) a propriedade não é passada e o release continua caindo na
      # assinatura de debug, compilando normalmente.
      - name: Build (release assinado)
        if: env.PUBLISH == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease -PrequireSigning=true

      # Numa release o arquivo leva o nome da versão (v1.1); fora dela, o SHA
      # curto — assim dá para saber de que commit veio um APK avulso.
      # `SIGNED` diz apenas se o APK veio da VARIANTE release (o passo acima
      # rodou e produziu o arquivo); QUEM assinou é o passo seguinte que
      # confere, com o apksigner. Confundir as duas coisas foi exatamente o
      # defeito que existia aqui.
      - name: Nomear o APK
        run: |
          mkdir -p dist
          if [ "$PUBLISH" = "true" ] && [ -f app/build/outputs/apk/release/app-release.apk ]; then
            SRC=app/build/outputs/apk/release/app-release.apk
            echo "SIGNED=true" >> "$GITHUB_ENV"
          else
            SRC=app/build/outputs/apk/debug/app-debug.apk
            echo "SIGNED=false" >> "$GITHUB_ENV"
          fi
          cp "$SRC" "dist/audio-visual-iasd-${APK_NAME}.apk"
          echo "APK publicado a partir de: $SRC"

      # Checagem POSITIVA: pergunta ao apksigner QUEM assinou o APK que vai ser
      # publicado, em vez de deduzir da existência de um arquivo. A dedução
      # antiga ("existe app-release.apk logo está assinado") era código morto:
      # o build.gradle.kts atribui a signingConfig de debug quando não há
      # keystore, e o AGP só acrescenta o sufixo `-unsigned` ao nome quando a
      # variante não tem signingConfig NENHUM — o arquivo existia sempre,
      # SIGNED virava 'true' e esta etapa era PULADA. O que saía era uma
      # Release assinada com a debug.keystore gerada pelo runner naquela
      # execução: chave diferente a cada run, INSTALL_FAILED_UPDATE_INCOMPATIBLE
      # no aparelho e, como única saída, desinstalar — apagando IndexedDB/OPFS
      # (Cronograma, pastas, hinos e Bíblia baixados).
      # A chave de debug do Android tem CN=Android Debug fixo, então o teste é
      # exato e não depende de conhecer o CN da keystore de produção.
      - name: Conferir assinatura da Release
        if: env.PUBLISH == 'true'
        run: |
          set -euo pipefail
          # Primeiro o caso grosseiro (nem chegou a sair um APK de release), que
          # tem mensagem própria; só depois o que exige a ferramenta.
          if [ "$SIGNED" != "true" ]; then
            echo "::error::Release pedida, mas o APK assinado não foi gerado."
            echo "Confira os secrets KEYSTORE_B64, KEY_ALIAS e KEY_PASSWORD."
            exit 1
          fi
          APK=$(ls dist/*.apk)
          # O apksigner vem no build-tools do SDK do runner; a versão instalada
          # muda com o tempo, então pega-se a mais nova em vez de fixar uma. O
          # `:-` cobre as duas variáveis porque o `set -u` transformaria uma
          # delas ausente numa falha sem explicação.
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK" ]; then
            echo "::error::SDK do Android não encontrado (ANDROID_HOME/ANDROID_SDK_ROOT)."
            exit 1
          fi
          BT=$(ls -d "$SDK"/build-tools/* | sort -V | tail -1)
          CERTS=$("$BT/apksigner" verify --print-certs "$APK")
          echo "$CERTS"
          if echo "$CERTS" | grep -q "CN=Android Debug"; then
            echo "::error::O APK da Release está assinado com a chave de DEBUG."
            echo "Instalar por cima seria recusado pelo Android (a chave de"
            echo "debug muda a cada execução do runner). Confira os secrets"
            echo "KEYSTORE_B64, KEY_ALIAS e KEY_PASSWORD."
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: audio-visual-iasd-apk
          path: dist/*.apk
          if-no-files-found: error

      # Uma Release dá link DIRETO para o .apk — instalar pelo artifact
      # exigiria descompactar um .zip no celular. Num disparo manual, a
      # action cria a tag apontando para o commit construído.
      # Republicar uma tag que já existe. O `action-gh-release` NÃO move uma tag
      # existente — ela continua apontando para onde nasceu —, então apagar a
      # Release junto com a tag é o que permite recriá-la no `target_commitish`
      # abaixo. Fica atrás de um input próprio, desligado por padrão: mover uma
      # tag é destrutivo e não pode ser efeito colateral de uma publicação
      # comum, em que a tag nova simplesmente ainda não existe.
      - name: Mover a tag existente (retag)
        if: env.PUBLISH == 'true' && github.event.inputs.retag == 'true' && github.event.inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.release_tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Apagando a Release e a tag $TAG para recriá-las em main…"
            gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          else
            echo "Tag $TAG não existe — nada a mover."
          fi

      - uses: softprops/action-gh-release@v2
        if: env.PUBLISH == 'true'
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          # `target_commitish` só é usado pela API do GitHub para CRIAR a ref
          # quando ela ainda não existe — ou seja, apenas no disparo manual com
          # `release_tag` (e no `retag`, que apaga a tag antes). No fluxo
          # documentado (`git tag v1.0 && git push --tags`) a tag JÁ EXISTE
          # quando o workflow roda, e este campo não faz nada: a Release aponta
          # para onde o `git tag` local foi feito. Quem garante a coerência no
          # disparo manual é o `checkout` com `ref: main` lá em cima — assim o
          # APK publicado vem do MESMO commit que a tag passa a apontar.
          target_commitish: main
          files: dist/*.apk
          generate_release_notes: true
          body: |
            Baixe o `.apk` abaixo e instale pelo Chrome do celular
            (o Android vai pedir para autorizar "fontes desconhecidas").

            Conecte a TV (Smart View / MiraScreen / cabo USB-C→HDMI) e abra o
            app: o telão é detectado sozinho e recebe **só o Display**, sem
            espelhar a tela do celular. Sem TV conectada, a projeção continua
            sendo a preview do Controle em tela cheia.

            > **Atualiza por cima.** A partir da v1.1 o APK é assinado com
            > keystore fixa: instale sobre a versão anterior sem desinstalar —
            > os dados do app (Cronograma, pastas sincronizadas, hinos e
            > Bíblia baixados) são preservados.
            >
            > Vindo da **v1.0**, que saiu com assinatura de debug, esta única
            > troca ainda exige desinstalar antes.
