name: Build APK

on:
  push:
    branches: [main, 'claude/**']
    tags: ['v*']
  pull_request:
    branches: [main]
  # A RELEASE SAINDO É UM GATILHO DO CANAL OTA (v5.234) — MAS ELE NÃO CHEGA
  # SOZINHO NO FLUXO POR TAG.
  #
  # Quando o lote declara `shellTag` em `version.json`, o `web-ota` do push em
  # main SEGURA a publicação: um bundle que pressupõe um shell que ainda não
  # existe é exatamente a janela que este lote fecha. Quem a reabre é a Release.
  #
  # Só que a Release deste workflow é criada pelo `action-gh-release` com o
  # GITHUB_TOKEN padrão, e evento originado nesse token NÃO cria execução nova
  # de workflow. No fluxo documentado (`git tag v2.3 && git push --tags`) este
  # gatilho portanto NUNCA vem, e o HOLD ficaria preso esperando um evento que
  # não existe — "a atualização não chega", outra vez.
  #
  # QUEM SOLTA O HOLD É O PRÓPRIO PUSH DA TAG: o `web-ota` roda também em
  # `refs/tags/v*` e espera o job `apk` (ver o `needs` dele), ou seja, consulta a
  # Release já publicada, no MESMO run. Esta linha fica para o caso em que a
  # Release nasce de outra mão — a interface do GitHub, ou um PAT —, e aí ela
  # dispara de verdade.
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Publicar Release com esta tag (ex: v1.1). Vazio = só compila.'
        required: false
        default: ''
      retag:
        description: 'Se a tag já existir, MOVER para o commit atual (apaga e recria a Release)'
        type: boolean
        required: false
        default: false
      # A VÁLVULA DO PORTÃO — ver "Oráculos em Chromium".
      #
      # Ela existe para o caso em que o canal precisa sair com um oráculo de
      # navegador reprovado e uma PESSOA assume isso: uma reprovação que o lote
      # não causou, um oráculo que envelheceu, uma urgência de sábado de manhã.
      # É só no disparo MANUAL de propósito — nenhum push a alcança, e portanto
      # não há como acioná-la por esquecimento.
      #
      # E ela NÃO silencia: o placar continua no resumo, o `::error::` de cada
      # reprovado continua no log, e o resumo ganha uma linha dizendo que o
      # portão foi aberto à mão. Uma válvula que não deixa rastro é o
      # `continue-on-error` de volta, com outro nome.
      ignorar_oraculos:
        description: 'PUBLICAR MESMO COM ORÁCULO DE CHROMIUM REPROVADO (registrado no resumo)'
        type: boolean
        required: false
        default: false
      # A VÁLVULA DA RENUMERAÇÃO, e ela existe por um caso só.
      #
      # A guarda anti-regressão recusa publicar um manifesto com versão MENOR
      # que a no ar, porque o aparelho descartaria em silêncio e o canal ficaria
      # inerte — o pior modo de falhar deste projeto. Só que uma renumeração
      # DELIBERADA (a v1.0, que reinicia a linha da base web) é indistinguível
      # do acidente que a guarda previne: as duas são "a nova é menor".
      #
      # Sem esta válvula o reset é impossível de concluir; com ela ligada por
      # engano, o canal regride. Por isso é só no disparo MANUAL, e por isso ela
      # grava no resumo o que fez — nenhum push a alcança.
      permitir_regressao:
        description: 'PUBLICAR UM MANIFESTO COM VERSÃO MENOR que a no ar (renumeração deliberada)'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

env:
  # Publicar uma Release: por tag `v*` ou por disparo manual com release_tag.
  PUBLISH: ${{ startsWith(github.ref, 'refs/tags/v') || github.event.inputs.release_tag != '' }}

jobs:
  # O PORTÃO, E ELE É UM JOB À PARTE (v5.314).
  #
  # A suíte inteira morava dentro do `web-ota`, cujo `if` exige
  # `refs/heads/main`: a PRIMEIRA vez que um oráculo via o commit era DEPOIS do
  # merge, já na linha que alimenta a frota. Um `tokens.test.mjs` que reprovasse
  # ali não publicava o bundle — mas `main` já continha o commit, e a saída era
  # um segundo lote. Aqui não há `if` de branch: roda em push de `claude/**`, em
  # PR, em tag e no `release`, ANTES de existir qualquer publicação.
  #
  # `needs:` NÃO compartilha o diretório de trabalho, por isso o checkout
  # próprio — e ele repete o `ref` do `web-ota` de propósito: verificar uma
  # árvore diferente da que vai ser empacotada não verifica nada.
  verificar:
    # SEM DUPLICAR O PUSH DE BRANCH COM PR ABERTO. `on.push` já cobre
    # `claude/**`, então um PR desta mesma origem dispararia a suíte duas vezes
    # sobre o mesmo commit. Fica de fora só o `pull_request` cuja cabeça é ESTE
    # repositório; o PR vindo de um fork (que não gera `push` aqui) continua
    # sendo verificado, que é justamente o caso em que ninguém mais olharia.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      # No evento `release` o `github.ref` é a TAG, e o que precisa ser
      # verificado é a base web de `main` — a mesma que o `web-ota` empacota.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'release' && 'main' || '' }}

      # O canal OTA publica direto para a frota: um erro de sintaxe aqui chega
      # aos aparelhos e o watchdog de boot NÃO evita o primeiro estrago —
      # `beginSession()` arma o pending e SERVE o bundle; só o lançamento
      # seguinte o descarta. Ou seja, um lançamento quebrado por aparelho,
      # garantido, e se for o do culto o operador fica sem sistema até fechar e
      # reabrir o app. `node --check` é a verificação mais barata que pega
      # justamente o caso letal (o `node` já vem no runner), e com
      # `set -euo pipefail` qualquer falha reprova o job ANTES de publicar.
      # Não substitui teste de comportamento — só garante que o bundle carrega.
      - name: Sanidade da base web (sintaxe do JS)
        run: |
          set -euo pipefail
          # `vendor/` fica de fora: é código buildado de terceiro (ESM), e o
          # `node --check` só o aceita pela detecção automática de módulo do
          # Node — uma regressão do runner bloquearia o canal OTA inteiro por
          # um arquivo que não é nosso.
          find app/src/main/assets/web -name '*.js' -not -path '*/vendor/*' -print0 |
            xargs -0 -n1 -t node --check
          python3 - <<'PY'
          import json, re
          m = json.load(open('app/src/main/assets/web/version.json'))
          assert m['version'], m
          # O TETO VEM DO PRÓPRIO KOTLIN, nunca digitado aqui. Um `minShell`
          # maior que o `SHELL_VERSION` do shell que está sendo compilado é um
          # bundle que NENHUM aparelho aceita — a válvula do OTA o recusa, o
          # canal fica inerte e o sintoma é "a atualização não chega", que é o
          # modo de falhar mais mudo deste projeto. Um dígito a mais num campo
          # que ninguém relê é tudo o que custa.
          kt = open('app/src/main/java/br/org/iasd/av/NativeBridge.kt').read()
          mshell = re.search(r'const val SHELL_VERSION\s*=\s*(\d+)', kt)
          assert mshell, 'SHELL_VERSION não encontrado em NativeBridge.kt'
          teto = int(mshell.group(1))
          assert 1 <= int(m['minShell']) <= teto, (
              f"minShell={m['minShell']} fora de 1..{teto} (o SHELL_VERSION deste shell)")
          # `shellTag` é o ACOPLAMENTO com a Release (v5.234): declarado, ele
          # segura a publicação do bundle até a Release existir. Um valor
          # malformado ("1.99" sem o v, um espaço solto) não seria erro em lugar
          # nenhum — a consulta à API devolveria 404, o job seguraria o OTA para
          # sempre, e o sintoma no aparelho seria "a atualização não chega", que
          # é o modo de falhar mais mudo que este canal tem. Por isso a forma é
          # exigida aqui, onde a mensagem ainda pode nomeá-la.
          # A FORMA DO NÚMERO — `MAIOR.INCREMENTAL[.CORREÇÃO]`, e nada mais.
          # Ela é conferida aqui porque `compareVersions` NÃO reclama de lixo:
          # ele lê o prefixo numérico de cada componente e ignora o resto, então
          # um "1.0.1-rc" compara igual a "1.0.1" e um "v1.0.1" vira "0.0.1" —
          # os dois publicam, e o aparelho decide errado em silêncio. O sufixo
          # opcional aceita a `1.0` histórica; daqui para a frente todo lote tem
          # os três degraus (ver "O NÚMERO" no CLAUDE.md).
          assert re.fullmatch(r'[0-9]+\.[0-9]+(\.[0-9]+)?', m['version']), (
              f"version malformada: {m['version']!r} — use MAIOR.INCREMENTAL.CORREÇÃO, ex. \"1.0.1\"")
          tag = m.get('shellTag', '')
          assert isinstance(tag, str), m
          assert not tag or re.fullmatch(r'v[0-9]+(\.[0-9]+)*', tag), (
              f'shellTag malformado: {tag!r} — use o formato da tag, ex. "v1.0.1"')
          # E ELA TEM DE SER A MESMA VERSÃO. `shellTag` declara "este bundle
          # PRECISA desta Release"; apontar para outro número publica um
          # manifesto em que a base diz uma coisa e o APK anunciado diz outra —
          # e o operador recebe as duas metades de lotes diferentes, sem nada
          # que explique. Um dígito trocado é tudo o que custa.
          assert not tag or tag == 'v' + m['version'], (
              f"shellTag {tag!r} não bate com a version {m['version']!r} — "
              f"o esperado é 'v{m['version']}'")
          print('version.json OK:', m)
          PY
          # A versão mora em TRÊS lugares (ver CLAUDE.md), e os três precisam
          # bater: esquecer o WEB_VERSION é "o erro silencioso" (o OTA distribui
          # e o aparelho exibe a versão antiga) e esquecer o version.json é "o
          # erro mudo" (nada chega a aparelho nenhum). Até aqui a única defesa
          # era disciplina; este assert fecha a classe.
          python3 - <<'PY'
          import json, re
          raiz = 'app/src/main/assets/web'
          vjson = json.load(open(f'{raiz}/version.json'))['version']
          js = open(f'{raiz}/controle/controle.js', encoding='utf-8').read()
          vjs = re.search(r"^const WEB_VERSION = '([^']+)'", js, re.M).group(1)
          html = open(f'{raiz}/controle/index.html', encoding='utf-8').read()
          vhtml = re.search(r'id="appVersion"[^>]*>[^<]*?v([0-9][0-9.]*)<', html).group(1)
          assert vjson == vjs == vhtml, (
              f'os três lugares de versão divergem: version.json={vjson} '
              f'controle.js WEB_VERSION={vjs} index.html #appVersion={vhtml}')
          print('três lugares de versão OK:', vjson)
          PY
          # A LINHA DO TEMPO DA ATUALIZAÇÃO (`notas.json`, v1.0.6). Ela falha
          # CALADA nas duas pontas: o `notasPendentes` do shell devolve lista
          # vazia diante de qualquer coisa que não consiga ler, e o diálogo
          # simplesmente não desenha lista nenhuma — a atualização acontece do
          # mesmo jeito, e ninguém descobre que o recurso morreu. Um JSON
          # malformado, uma entrada sem `versao` ou a versão deste lote AUSENTE
          # do arquivo dão todos o mesmo desfecho mudo. Aqui eles são erro.
          python3 - <<'PY'
          import json, re
          raiz = 'app/src/main/assets/web'
          versao = json.load(open(f'{raiz}/version.json'))['version']
          notas = json.load(open(f'{raiz}/notas.json', encoding='utf-8'))
          assert isinstance(notas, list) and notas, 'notas.json vazio ou não é lista'
          vistas = set()
          for e in notas:
              assert isinstance(e, dict), f'entrada não é objeto: {e!r}'
              v = e.get('versao', '')
              assert re.fullmatch(r'[0-9]+\.[0-9]+(\.[0-9]+)?', v), f'versao malformada: {v!r}'
              assert v not in vistas, f'versao repetida em notas.json: {v}'
              vistas.add(v)
              itens = e.get('itens')
              assert isinstance(itens, list) and itens, f'v{v} sem itens'
              for t in itens:
                  assert isinstance(t, str) and t.strip(), f'v{v} tem item vazio'
                  # CADA ITEM É UM TÓPICO (v1.4.12) — ver o CLAUDE.md, "As notas
                  # viajam DENTRO do bundle". As duas regras abaixo são as
                  # mecânicas do padrão; a terceira ("nomeia, não explica") é de
                  # julgamento e fica na prosa. Sem elas o estilo erode item a
                  # item, e ninguém percebe até o arquivo estar em 24 kB de novo.
                  assert len(t) <= 120, (
                      f'v{v}: item de {len(t)} caracteres, teto 120 — a lista do '
                      f'diálogo é uma linha do tempo, não um texto: {t[:60]}…')
                  caixa = re.findall(r'\b[A-ZÁÂÃÀÉÊÍÓÔÕÚÇ]{3,}\b', t)
                  assert len(caixa) <= 1, (
                      f'v{v}: {len(caixa)} palavras em CAIXA ALTA ({caixa}) — numa '
                      f'lista de seis isso é a tela gritando: {t[:60]}…')
          # ESTE LOTE PRECISA ESTAR DESCRITO. É o esquecimento provável — se
          # publica-se uma versão e não se escreve o que ela mudou, o operador
          # recebe a pergunta sem a lista e nada avisa ninguém.
          assert notas[0]['versao'] == versao, (
              f"notas.json começa em v{notas[0]['versao']} e este lote é v{versao} — "
              'a entrada mais nova tem de ser a deste lote')
          print(f'notas.json OK: {len(notas)} versão(ões), a mais nova v{versao}')
          PY
          # ---------- OS ORÁCULOS DE NODE PURO ----------
          #
          # Determinísticos, sem rede e SEM NAVEGADOR — e por isso rodam AQUI,
          # antes do `npm ci`. Nenhum deles pode importar `tools/arnes.mjs`
          # (que importa o Playwright): passaria na máquina de quem escreve e
          # falharia só no runner, num passo sem `continue-on-error`. A asserção
          # compartilhada mora em `tools/checar.mjs`, que não tem `import`
          # nenhum, justamente para isto.
          #
          # Eles entram neste passo, e não num framework de teste, pela mesma
          # natureza do `node --check` acima: o passo existe para impedir que o
          # canal OTA publique um bundle quebrado, e cada um destes trava um
          # defeito que NÃO dá erro em lugar nenhum.
          #
          # A razão de cada um está no TOPO do próprio arquivo — não repetida
          # aqui, pelo motivo escrito na lista do passo dos oráculos de
          # Chromium: a segunda cópia é a que ninguém relê, e foi ela que passou
          # versões descrevendo o RECADO (removido na v1.2.17) como recurso
          # vivo.
          node tools/sidx.test.mjs
          node tools/degrau-de-banda.test.mjs
          node tools/degrau-e-prazo.test.mjs
          node tools/webview-range.test.mjs
          node tools/contexto-seguro.test.mjs
          node tools/sombra.test.mjs

          node tools/tipos-que-sobem.test.mjs

          node tools/mic-escada.test.mjs
          node tools/serie.test.mjs
          node tools/sorteio.test.mjs
          node tools/hinario.test.mjs
          node tools/coletanea.test.mjs
          node tools/glifos.test.mjs
          node tools/cifra.test.mjs

      - name: Tokens de CSS que não existem (Node puro)
        run: |
          # Um `var(--nao-existe)` SEM fallback computa para o valor INICIAL da
          # propriedade — sem aviso no console, sem erro, sem sintoma no lugar
          # da causa. Na v5.171 isso deixou os DOIS botões principais da folha
          # "Conectar uma tela" com `border-radius: 0`, os únicos cantos retos
          # de um app inteiro arredondado, e nenhuma ferramenta reclamou.
          # Mesma família do `setInteger` numa chave `long` e do `bytes`
          # esquecido no `bgProgress`. Determinístico: sem `continue-on-error`.
          node tools/tokens.test.mjs

      # ────────────────────────────────────────────────────────────────────
      # OS ORÁCULOS DE CHROMIUM, EM DOIS PASSOS (v5.213)
      #
      # Eram um só, e o arranjo tinha um defeito que o painel verde escondia:
      # `set -euo pipefail` com os testes em sequência faz o PRIMEIRO que
      # reprovar abortar os ONZE seguintes. Somado ao `continue-on-error`, o
      # desfecho era "um teste caiu, os outros nunca rodaram, e o run está
      # verde" — e descobrir isso exigia abrir o log e reparar em qual linha
      # ele parou. Um teste que não é lido não é rede de segurança; um teste
      # cujo RESULTADO não é lido também não.
      #
      # A separação não é organização: ela é o que deu sentido ao
      # `continue-on-error` enquanto ele viveu aqui. A justificativa dele era
      # INFRAESTRUTURA
      # (download do Chromium, runner sem rede), e infraestrutura agora é o
      # passo de baixo, sozinho. O passo dos testes ficou com uma causa só de
      # falhar — defeito de verdade —, roda todos eles SEMPRE (nenhum aborta o
      # próximo), emite `::error::` por reprovado e escreve o placar no resumo
      # do run, onde se lê sem abrir log nenhum.
      #
      # E ELE JÁ NÃO TEM `continue-on-error` (v5.316). A política durou enquanto
      # a premissa dela era verdadeira, e ela deixou de ser em duas etapas.
      #
      # O TEXTO ANTIGO CARREGAVA DUAS METADES. A razão declarada era
      # INFRAESTRUTURA ("download do Chromium, runner sem rede"), mas a frase
      # que a resumia já concedia o outro lado: "barrar o canal OTA por um
      # TESTE de navegador é trocar um risco raro por um bloqueio frequente" —
      # isto é, contemplava um oráculo reprovando de verdade e escolhia
      # absorvê-lo. A v5.213 mudou de endereço só a primeira metade (virou o
      # passo de cima, que ficou com o `continue-on-error` dela, e de quem
      # passaram a depender o `if` que pula estes oráculos e o aviso do pulo).
      # A segunda nunca foi reexaminada — e é a MEDIÇÃO abaixo que a derruba: a
      # troca prometida era "um risco raro por um bloqueio frequente", e o que
      # se mediu é o inverso nos dois termos.
      #
      # MEDIDO antes de mexer: 21 dos 23 runs anteriores terminaram VERDES com
      # oráculo reprovado dentro, 40 reprovações somadas, UMA delas um defeito
      # de verdade. As outras 39 eram o oráculo medindo o RUNNER. As cinco
      # classes que este lote leu e reproduziu — não um inventário fechado das
      # 39 — foram: prazo de parede lido como veredito; altura em pixel que
      # depende da FONTE instalada; estado que a enquete ainda não tinha lido; a
      # montagem do cenário correndo contra o que o app faz na abertura; e prazo
      # menor que a CADÊNCIA do app. Nenhuma delas se conserta com
      # `continue-on-error`: ela as PRESERVA, porque tira o custo de conviver
      # com elas. As cinco foram à raiz neste lote (ver os comentários de
      # `ota.test.mjs`, `destinos.test.mjs` e `boot-nativo.test.mjs`) — e DUAS
      # delas eram defeito do APP, não do teste: o read-modify-write do diário
      # das séries e, pior, `setState` resolvendo ANTES do commit no caminho que
      # grava a intenção do OTA e recarrega o documento na linha seguinte.
      #
      # A prova de que dá para fechar o portão é uma CAMPANHA, não uma execução:
      # os dezesseis oráculos, 4 rodadas, com a máquina a 2× de carga (4 vCPU, 4
      # processos ocupando os núcleos) — o mesmo formato do runner —, mais 20
      # execuções do `ota.test.mjs` a 4×, que é onde moravam quatro das cinco
      # classes. 64/64 e 20/20. A nota da versão tem o detalhe.
      #
      # O que fica de escapatória é a válvula MANUAL (`ignorar_oraculos`, acima)
      # e ela deixa rastro no resumo. A diferença entre as duas não é de grau: o
      # `continue-on-error` decidia por todo mundo, para sempre e sem registro;
      # a válvula é uma pessoa decidindo uma vez, e assinando.
      # ────────────────────────────────────────────────────────────────────
      # ---------- E ELE TEM PRAZO ----------
      # `continue-on-error` protege contra FALHAR, não contra TRAVAR — e os dois
      # não são o mesmo evento. Medido: na v5.302 este passo ficou **43 minutos**
      # pendurado num `npm i`/`playwright install` que não voltava, e foi
      # cancelado à mão. O bundle daquele lote nunca chegou ao canal.
      #
      # O mecanismo mudou com o portão virar job à parte; o efeito no aparelho é
      # o mesmo. Um travamento aqui não pula passo nenhum DESTE job — ele impede
      # o `web-ota` de COMEÇAR, porque o `verificar` é `needs` dele e exigido em
      # SUCESSO. E a fila `concurrency: web-ota` nem chega a ser tomada: o lote
      # SEGUINTE não espera atrás deste, mas o bundle DESTE não sai.
      #
      # O modo de falhar é MUDO nas duas pontas: o run não fica vermelho (o
      # `continue-on-error` o absorve) e o aparelho não tem o que mostrar — do
      # lado de quem opera, "a atualização não chega", sem nada em lugar nenhum
      # que o explique. O prazo transforma isso num passo que TERMINA: os
      # oráculos de Chromium são pulados (o `if` abaixo já cuida disso) e o
      # bundle publica, que é o que não pode faltar.
      #
      # 10 min é folga larga sobre o normal — medido em 24 s na execução seguinte.
      - name: Preparar o Chromium (infraestrutura)
        id: chromium
        continue-on-error: true
        timeout-minutes: 10
        run: |
          set -euo pipefail
          # `npm ci`, e não `npm i playwright`: ele obedece ao
          # `package-lock.json` versionado e falha se o lock divergir do
          # `package.json`. Com `npm i` a versão era a `latest` do dia — o
          # veredito do CI não era função só do nosso código.
          #
          # E DESDE QUE O PORTÃO FECHOU (v5.316) O NÚMERO DO PIN TAMBÉM É
          # CONTRATO. Uma reprovação no passo de baixo — o dos ORÁCULOS, que já
          # não tem `continue-on-error` — deixou de ser aviso e passou a segurar
          # o canal. Reproduzi-la fora do runner deixou de ser conveniência e
          # virou requisito — um portão que só fecha e não se abre por inspeção é um
          # portão que se abre com a válvula, sempre. Daí a regra: **subir o pin
          # obriga a repetir a campanha de determinismo na versão nova**, porque
          # é o navegador que decide altura de linha, ordem de evento e quanto
          # tempo uma página leva para assentar. O placar da campanha vale para
          # a versão em que foi medido, e para nenhuma outra.
          npm ci --no-audit --no-fund --silent
          npx playwright install --with-deps chromium

      # FUMAÇA DO CONTROLE e os demais oráculos, num Chromium de verdade. Os
      # passos acima provam que os arquivos são PARSEÁVEIS; estes provam que o
      # app SOBE e responde ao toque. A distinção não é acadêmica: a v5.121 saiu
      # com o botão de copiar o Registro chamando uma função que uma limpeza
      # tinha apagado — sintaxe perfeita, `node --check` verde, botão morto no
      # aparelho.
      #
      # `if` no resultado do passo de cima: sem Chromium instalado todos
      # falhariam por um motivo que não é deles, e uma dúzia de `::error::` de
      # infraestrutura é exatamente o ruído que ensina a ignorar vermelho.
      # PRAZO AQUI TAMBÉM, e pela mesma razão: um oráculo que pendure o
      # navegador (uma Promise que nunca resolve, um `waitForFunction` sem
      # timeout) trava o job inteiro e leva o canal OTA junto. O prazo é folga
      # larga: MEDIDO, os 57 somam ~7,4 min em SÉRIE e ~2,5 min nos três
      # processos em que rodam hoje — e o prazo cobre o pior caso, que é a
      # paralelização não pegar por qualquer razão e a lista correr em fila.
      - name: Oráculos em Chromium
        if: steps.chromium.outcome == 'success'
        timeout-minutes: 15
        env:
          IGNORAR: ${{ github.event.inputs.ignorar_oraculos }}
        run: |
          # SEM `-e`, e é o ponto do passo: um reprovado não pode calar os que
          # vêm depois. Quem guarda o desfecho é o laço do fim.
          set -uo pipefail

          # ---------- EM PARALELO, E O `rodar` SÓ ENFILEIRA ----------
          #
          # MEDIDO: os 57 oráculos somam ~8 min em série, e o custo NÃO é o que
          # parece — lançar o Chromium são ~110 ms e subir o `/controle/`
          # inteiro é ~1 s. O que sobra é espera: cada oráculo passa a maior
          # parte do tempo parado esperando o app dele assentar, com os quatro
          # núcleos do runner ociosos.
          #
          # Rodar em paralelo é seguro por CONSTRUÇÃO, e isso foi conferido
          # antes de ligar: todos abrem o servidor com `listen(0)` (porta
          # efêmera), nenhum escreve arquivo temporário compartilhado, e cada um
          # lança o próprio navegador com o próprio perfil. Não há estado comum
          # a disputar.
          #
          # TRÊS, e não `nproc`: o runner tem 4 vCPU, e a campanha de
          # determinismo da v5.316 validou os oráculos com a máquina a 2× de
          # carga (4 processos disputando 4 núcleos). Três de cada vez fica
          # DENTRO desse envelope já medido e entrega ~3× — o grosso do ganho —
          # sem apostar num regime que ninguém mediu. Subir este número é subir
          # a carga, e a regra do projeto vale aqui: repetir a campanha antes.
          #
          # A CAMPANHA QUE AUTORIZOU ISTO: os 72 oráculos, SETE rodadas em
          # paralelo, 72/72 em todas, ~152 s por rodada contra 442 s em série
          # (2,9×). Ela achou UM defeito, e é o que a regra prevê — "uma
          # reprovação a cada N execuções não é ruído, é o achado": o
          # `sorteio-tela` montava o índice de letras na montagem do cenário, e
          # o `finally` do `syncLyrics` (que sai da abertura SEM `await`) o
          # anulava entre dois `evaluate`. Pool VAZIO com duas asserções verdes
          # antes da vermelha. Corrigido no ponto de USO e provado por reversão;
          # a classe está na tabela do CLAUDE.md.
          PARALELO=3
          saida="$(mktemp -d)"
          lista=()
          rodar() { lista+=("$1"); }

          # ---------- A LISTA, E POR QUE ELA NÃO SE EXPLICA AQUI ----------
          #
          # Cada oráculo carrega a razão de existir no TOPO do próprio arquivo —
          # o defeito que ele trava, como aquele defeito falha calado, e o que
          # foi medido. Este passo teve, por muito tempo, um resumo dessa razão
          # ao lado de cada linha: 485 linhas de comentário para 57 comandos,
          # cada justificativa escrita DUAS vezes.
          #
          # A segunda cópia é a que ninguém relê, e ela não envelheceu calada:
          # o bloco do `mic-escada` descrevia o RECADO — o microfone estilo
          # walkie-talkie do Controle — como recurso vivo. Ele saiu na v1.2.17,
          # o próprio oráculo diz isso na terceira linha dele, e o workflow
          # seguiu afirmando o contrário. É a regra do projeto cobrada aqui:
          # *"um comentário errado é pior que um comentário longo: ele não custa
          # só leitura, produz a decisão errada."*
          #
          # Então a lista é só a lista. Para saber o que um oráculo trava, abra
          # o arquivo — é uma linha de `head`, e lá a resposta está inteira e não
          # tem como divergir do que descreve. O mapa por assunto está no
          # CLAUDE.md, em "Os oráculos".
          rodar tools/smoke.mjs
          rodar tools/boot-nativo.test.mjs
          rodar tools/mse.test.mjs
          rodar tools/stage-fade.test.mjs
          rodar tools/aba-sem-estalo.test.mjs
          rodar tools/link-perde-a-vez.test.mjs
          rodar tools/espera-do-stream.test.mjs
          rodar tools/fome-que-desiste.test.mjs
          rodar tools/stream-so-audio.test.mjs
          rodar tools/rotina-cede-a-vez.test.mjs
          rodar tools/db-gc.test.mjs
          rodar tools/db-estado.test.mjs
          rodar tools/acervo.test.mjs
          rodar tools/ponte.test.mjs
          rodar tools/recusa-transmissao.test.mjs
          rodar tools/display-smoke.mjs
          rodar tools/destinos.test.mjs
          rodar tools/cifra-offline.test.mjs
          rodar tools/cifra-tela-cheia.test.mjs
          rodar tools/fonte-so-do-par.test.mjs
          rodar tools/leitor-biblioteca.test.mjs
          rodar tools/sorteio-tela.test.mjs
          rodar tools/cena.test.mjs
          rodar tools/hidratacao-perde-a-vez.test.mjs
          rodar tools/telao-no-chao.test.mjs
          rodar tools/imagem-sobre-audio.test.mjs
          rodar tools/slides-sobre-audio.test.mjs
          rodar tools/modo-facil-slides.test.mjs
          rodar tools/modo-facil-um-elemento.test.mjs
          rodar tools/modo-facil-fonte.test.mjs
          rodar tools/tela-rede.test.mjs
          rodar tools/registro.test.mjs
          rodar tools/ota.test.mjs
          rodar tools/gaveta-no-download.test.mjs
          rodar tools/hinario-tela.test.mjs
          rodar tools/parar-por-camada.test.mjs
          rodar tools/historico.test.mjs
          rodar tools/cifra-rolagem.test.mjs
          rodar tools/leitor-do-transporte.test.mjs
          rodar tools/controles-layout.test.mjs

          rodar tools/fundo-da-letra.test.mjs

          rodar tools/ferramentas-folha.test.mjs

          rodar tools/barra-em-qualquer-tela.test.mjs

          rodar tools/biblioteca-camadas.test.mjs

          rodar tools/aviso-de-importacao.test.mjs
          rodar tools/apresentacao.test.mjs
          rodar tools/notificacao-apresentacao.test.mjs
          rodar tools/leitor-apresentacao.test.mjs
          rodar tools/leitor-camadas.test.mjs
          rodar tools/toque-instantaneo.test.mjs

          rodar tools/excluir-em-cena.test.mjs

          rodar tools/restaurar-letra-adiada.test.mjs
          rodar tools/restaurar-letra-adiada-preview.test.mjs

          rodar tools/gaveta-e-cartao.test.mjs

          rodar tools/registro-alcance.test.mjs

          rodar tools/plataforma.test.mjs
          rodar tools/lista-da-biblioteca.test.mjs
          rodar tools/enquadramento-da-camada.test.mjs

          # O PLACAR VAI PARA O RESUMO DO RUN, não só para o log — a queixa que
          # originou este lote foi precisamente que o desfecho só existia lá
          # dentro. `rodados` é CONTADO, nunca digitado: um número fixo aqui
          # envelheceria no primeiro oráculo novo, e envelheceria mentindo.
          # ---------- A EXECUÇÃO, E DEPOIS O LOG EM ORDEM ----------
          #
          # A saída de cada um vai para um arquivo e só então é impressa, na
          # ORDEM da lista: em paralelo os `::group::` sairiam intercalados, e um
          # log que não se lê não é rede de segurança — que é a lição do arranjo
          # anterior a v5.213, em que o primeiro reprovado calava os outros onze.
          printf '%s\n' "${lista[@]}" | nl -ba -w1 -s' ' |
            xargs -P "$PARALELO" -L1 sh -c 'PW_CHROMIUM="" node "$2" > "$0/$1.log" 2>&1; echo $? > "$0/$1.rc"' "$saida"

          rodados=0
          falhas=()
          for i in "${!lista[@]}"; do
            n=$((i + 1)); f="${lista[$i]}"
            rodados=$((rodados + 1))
            echo "::group::$f"
            cat "$saida/$n.log" 2>/dev/null || echo "(sem saída — o processo não chegou a escrever)"
            echo "::endgroup::"
            # RC AUSENTE CONTA COMO REPROVADO. Um oráculo cujo processo morreu
            # sem escrever o código de saída (o prazo do passo, um OOM) não pode
            # entrar no placar como quem passou — seria o silêncio da v5.302 de
            # volta, agora por dentro do portão.
            rc="$(cat "$saida/$n.rc" 2>/dev/null || echo 1)"
            if [ "$rc" != "0" ]; then
              falhas+=("$f")
              echo "::error::$f REPROVOU"
            fi
          done

          passaram=$((rodados - ${#falhas[@]}))
          echo "Oráculos em Chromium: $passaram/$rodados passaram (em $PARALELO processos)." | tee -a "$GITHUB_STEP_SUMMARY"
          if [ ${#falhas[@]} -eq 0 ]; then exit 0; fi
          printf 'REPROVOU: %s\n' "${falhas[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
          # A VÁLVULA, e ela ASSINA. O placar e os `::error::` acima já saíram —
          # o que esta linha muda é só quem carrega a decisão, e ela fica
          # escrita no resumo do run, ao lado do que foi ignorado.
          if [ "${IGNORAR:-false}" = "true" ]; then
            echo "::warning::PORTÃO ABERTO À MÃO — ${#falhas[@]} oráculo(s) reprovado(s), e o disparo pediu 'ignorar_oraculos'"
            echo "> ⚠️ **Portão aberto à mão**: o disparo manual marcou \`ignorar_oraculos\`, então o bundle publica com ${#falhas[@]} oráculo(s) reprovado(s) acima." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          exit 1

      # O PULO TAMBÉM VAI PARA O RESUMO. Sem este passo, um `Preparar o
      # Chromium` que falhe ou estoure o prazo deixava TODOS os oráculos de
      # fora SEM UMA LINHA em lugar nenhum: o resumo do run ficava idêntico ao
      # de uma execução em que tudo passou, e o bundle publicava do mesmo jeito.
      # É a mesma classe do incidente da v5.302, e a metade dele que o prazo não
      # cobriu — o prazo impede TRAVAR, não impede o SILÊNCIO.
      #
      # Não reprova o job de propósito, e desde a v5.316 é ele o ÚNICO caminho
      # em que um bundle chega à frota sem oráculo de navegador nenhum. A
      # assimetria é a política inteira, dita em duas linhas: oráculo REPROVADO
      # segura o canal (é o nosso código); infraestrutura AUSENTE não segura (é
      # o CDN de outra pessoa, e um download quebrado lá fora não pode calar a
      # atualização de uma igreja). Justamente por isso o aviso aqui é o que
      # impede a segunda metade de virar a primeira sem ninguém notar: sem esta
      # linha, um `Preparar o Chromium` que passasse a falhar SEMPRE devolveria
      # o mundo anterior — publicação sem verificação, e um resumo idêntico ao
      # de um run em que tudo passou.
      - name: Oráculos em Chromium — PULADOS (aviso)
        if: steps.chromium.outcome != 'success'
        run: |
          echo "::warning::Oráculos em Chromium PULADOS — 'Preparar o Chromium' terminou como '${{ steps.chromium.outcome }}'"
          echo "Oráculos em Chromium: NENHUM RODOU — **PULADOS** (infraestrutura: \`Preparar o Chromium\` terminou como \`${{ steps.chromium.outcome }}\`). O bundle publica assim mesmo; nenhum oráculo de navegador foi consultado neste run." >> "$GITHUB_STEP_SUMMARY"


  # Publica a base web como bundle OTA: um push em `main` chega sozinho aos
  # aparelhos, sem APK novo (ver WebUpdater.kt). O APK continua trazendo a
  # mesma base embutida, que é o fallback offline e o piso de versão.
  #
  # DAQUI PARA BAIXO SÓ SE EMPACOTA E PUBLICA: quem verifica é o `verificar`,
  # e o `needs` é o que impede um bundle reprovado de chegar à frota (job
  # reprovado ⇒ este é pulado ⇒ nada sobe).
  web-ota:
    # `apk` entra no `needs` pela ORDEM, não pelo resultado: é ele que publica a
    # Release, e o passo "A Release que este lote exige" precisa consultá-la
    # DEPOIS. Sem isso, no disparo manual os dois jobs corriam em paralelo e o
    # manifesto podia sair antes de a Release existir — o HOLD disparava por
    # corrida. O resultado do `apk` é deliberadamente ignorado (`!cancelled()`
    # sem checar `needs.apk.result`): uma falha de build Kotlin não pode
    # bloquear o canal da base web, e quando ela impede a Release quem segura é
    # o HOLD, com mensagem própria. Já o `verificar` é exigido em SUCESSO — é o
    # portão.
    #
    # `refs/tags/v*` está no `if` porque é o push da tag, e não o gatilho
    # `release`, que de fato chega (ver o comentário do `on:`). É por ele que o
    # HOLD do `shellTag` solta, e é por ele que uma Release só-Kotlin passa a ser
    # anunciada no manifesto — o ramo "sem shellTag" abaixo, que até aqui era
    # inalcançável porque dependia de um evento que nunca vinha.
    if: >-
      !cancelled()
      && needs.verificar.result == 'success'
      && (
        github.ref == 'refs/heads/main'
        || startsWith(github.ref, 'refs/tags/v')
        || (github.event_name == 'release'
            && github.event.release.tag_name != 'web-latest'
            && github.event.release.tag_name != 'dados-latest')
      )
    needs: [verificar, apk]
    runs-on: ubuntu-latest
    # Um grupo só, SEM cancelamento: os dois assets da release `web-latest`
    # (o zip e o version.json que carrega o sha256 dele) são substituídos um a
    # um, sem transação. Duas execuções em paralelo — o merge da branch seguido
    # de um push de correção é o caso normal — podem intercalar e deixar lá o
    # zip de uma com o sha256 da outra; a partir daí todo aparelho baixa,
    # confere o hash, e o OTA fica INERTE até o próximo push em main, sem
    # nenhum sinal (o checkAsync engole tudo em Log.i). Cancelar no meio do
    # upload produziria exatamente o mesmo estado, por isso a fila espera.
    concurrency:
      group: web-ota
      cancel-in-progress: false
    steps:
      # No evento `release` o `github.ref` é a TAG, e o que precisa ser
      # empacotado é a base web de `main` — a mesma de onde a Release nasceu
      # (`target_commitish: main`). Sem isto o republicar do OTA sairia do
      # commit da tag, que é o mesmo conteúdo por sorte e não por construção.
      # No PUSH da tag o vazio é o certo, e não por descuido: ali o ref É o
      # commit de que o APK acabou de ser compilado, que é mais forte que `main`
      # (que pode ter andado entre o `git tag` e o `git push --tags`).
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'release' && 'main' || '' }}

      # ────────────────────────────────────────────────────────────────────
      # A RELEASE QUE ESTE LOTE EXIGE (v5.234)
      #
      # Até aqui os dois canais eram independentes e o push em main publicava o
      # bundle na hora. Quando o lote mexia no Kotlin, todo aparelho recebia web
      # NOVO com shell VELHO por horas ou dias — e a única defesa era `minShell`,
      # que este projeto mantém em 2 de propósito (subi-lo recusaria a
      # atualização inteira em quem estivesse atrasado). O operador via metade
      # do lote funcionando e metade não, sem nada que explicasse a diferença.
      #
      # Agora `shellTag` no `version.json` do repositório declara a dependência,
      # e este passo é o portão: sem a Release publicada, o bundle NÃO sai. O
      # job termina VERDE, porque isto não é falha — é o estado normal entre o
      # merge e o disparo da Release, e pintá-lo de vermelho ensinaria a ignorar
      # vermelho (a lição da v5.204).
      #
      # Havendo a Release, o manifesto sai com o bloco `shell`, e é dele que o
      # aparelho tira o link do APK: uma tela só, uma decisão só, e ZERO
      # consultas à API do GitHub na ronda rápida — que é o que permite a ronda
      # ser rápida sem estourar o limite de 60 requisições por hora.
      # ────────────────────────────────────────────────────────────────────
      - name: A Release que este lote exige
        id: shell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=$(python3 -c "import json;print(json.load(open('app/src/main/assets/web/version.json')).get('shellTag',''))")
          # `|| true` porque um 404 é resposta esperada (a Release ainda não
          # saiu), e com `set -e` ele abortaria o job com cara de defeito.
          EXIGIDA=$([ -n "$TAG" ] && echo sim || echo nao)
          if [ -n "$TAG" ]; then
            echo "Este lote EXIGE a Release $TAG."
            REL=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
                    --json tagName,assets 2>/dev/null || true)
            if [ -z "$REL" ]; then
              echo "SEGURANDO O OTA: a Release $TAG ainda não existe." \
                | tee -a "$GITHUB_STEP_SUMMARY"
              echo "O bundle sai no push da tag \`$TAG\` (este mesmo job roda de novo, atrás do \`apk\`)." \
                >> "$GITHUB_STEP_SUMMARY"
              echo "Se a Release for criada por fora do workflow e nada publicar, reexecute este run." \
                >> "$GITHUB_STEP_SUMMARY"
              echo "HOLD=true" >> "$GITHUB_ENV"
              exit 0
            fi
          else
            # SEM `shellTag` O MANIFESTO AINDA ANUNCIA O APK MAIS RECENTE, e
            # isto não é zelo: é o buraco que a primeira versão deste passo
            # deixou aberta. `shellTag` responde "este lote PRECISA de uma
            # Release?" — e uma Release publicada sem que a base web mudasse
            # (uma correção só de Kotlin) não a declara em lugar nenhum. Sem
            # esta metade, esse APK nunca seria anunciado a aparelho nenhum e o
            # operador voltaria a caçá-lo no navegador, que é exatamente o
            # atrito que este lote existe para acabar.
            #
            # `gh release view` sem tag devolve a "latest" da API, que ignora
            # prereleases — ou seja, a `web-latest` fica de fora por
            # construção, sem precisar de filtro.
            echo "Sem shellTag: nada a segurar. Anunciando a Release mais recente, se houver."
            REL=$(gh release view --repo "$GITHUB_REPOSITORY" \
                    --json tagName,assets 2>/dev/null || true)
            if [ -z "$REL" ]; then
              echo "Nenhuma Release publicada ainda: OTA puro."
              echo "SHELL_JSON=" >> "$GITHUB_ENV"
              exit 0
            fi
            TAG=$(printf '%s' "$REL" | python3 -c "import json,sys;print(json.load(sys.stdin)['tagName'])")
          fi
          SHELL_JSON=$(python3 - "$REL" "$TAG" <<'PY'
          import json, sys
          rel, tag = sys.argv[1], sys.argv[2]
          o = json.loads(rel)
          apk = next((a for a in o.get('assets', [])
                      if a.get('name', '').lower().endswith('.apk')), None)
          if not apk:
              # A Release existe e não tem APK: publicar o bundle apontando para
              # um shell que ninguém consegue instalar seria pior que segurar.
              print('SEM_APK'); raise SystemExit(0)
          print(json.dumps({
              'versao': tag.lstrip('vV'),
              'apk': apk['url'],
              'bytes': int(apk.get('size') or 0),
          }, separators=(',', ':')))
          PY
          )
          if [ "$SHELL_JSON" = "SEM_APK" ]; then
            # A ASSIMETRIA É A DECISÃO. Com o `needs: apk`, uma Release EXIGIDA
            # sem `.apk` já NÃO é a corrida entre criar a Release e anexar o
            # binário: este job só começa depois do `apk`, que publica os dois de
            # uma vez. Sobram a Release nascida por fora (a interface do GitHub,
            # um PAT) e o build Kotlin que falhou — e nos dois a saída é anexar o
            # `.apk` e REEXECUTAR o run, nunca esperar o gatilho `release`, que
            # no fluxo por tag não chega (ver o comentário do `on:`). Segurar
            # continua certo: apontar o manifesto para um shell que ninguém
            # consegue instalar é pior que não anunciá-lo. Já uma Release
            # qualquer sem `.apk` não tem nada a ver com este bundle: bloquear o
            # canal OTA inteiro por causa dela seria deixar a base web presa por
            # um evento que não é dela.
            if [ "$EXIGIDA" = "sim" ]; then
              echo "SEGURANDO O OTA: a Release $TAG existe mas ainda não tem .apk." \
                | tee -a "$GITHUB_STEP_SUMMARY"
              echo "HOLD=true" >> "$GITHUB_ENV"
            else
              echo "A Release $TAG não tem .apk — publicando sem o bloco shell."
              echo "SHELL_JSON=" >> "$GITHUB_ENV"
            fi
            exit 0
          fi
          echo "Release $TAG encontrada: $SHELL_JSON"
          echo "SHELL_JSON=$SHELL_JSON" >> "$GITHUB_ENV"

      # O MANIFESTO NUNCA REGRIDE. Esta guarda existe porque o `web-ota` deixou
      # de ser o primeiro job do run: ele espera `verificar` e `apk` (o `needs`),
      # e também roda no push da tag. As duas coisas soltam a ordem de chegada na
      # fila `concurrency: web-ota` da ordem dos PUSHES — quem chega primeiro
      # passa a ser quem compila mais rápido (cache quente × frio varia minutos),
      # e o run de uma tag empacota o commit DA TAG, que pode ser anterior ao que
      # o push de `main` já publicou.
      #
      # Publicar uma versão MENOR por cima de uma maior é o pior modo de falhar
      # deste projeto: `compareVersions` no aparelho descarta em silêncio, o lote
      # novo fica inalcançável até o próximo push, e não há vermelho em lugar
      # nenhum. A guarda compara com o manifesto que JÁ está no ar, pela mesma
      # regra numérica por componente do `WebUpdater.compareVersions` — nunca
      # lexical, senão `4.9` > `4.82`.
      #
      # Ela protege também o que já existia antes desta reestruturação: um
      # `retag`, ou dois runs que furem a fila por qualquer motivo.
      - name: O manifesto publicado é mais novo? (guarda anti-regressão)
        if: env.HOLD != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PERMITIR_REGRESSAO: ${{ github.event.inputs.permitir_regressao || 'false' }}
        run: |
          set -uo pipefail
          NOVA=$(python3 -c "import json;print(json.load(open('app/src/main/assets/web/version.json'))['version'])")
          # `gh release download`, e não a URL crua: o asset vem com a
          # credencial do run, sem depender de qual dos dois endereços o
          # `--json assets` chama de `url`. Sem `-e` aqui de propósito —
          # `web-latest` pode não existir (repositório novo, ou o primeiro
          # lançamento do canal), e isso não é falha.
          TMP=$(mktemp -d)
          gh release download web-latest -p version.json -D "$TMP" >/dev/null 2>&1 || true
          NO_AR=""
          if [ -f "$TMP/version.json" ]; then
            NO_AR=$(python3 -c "import json;print(json.load(open('$TMP/version.json')).get('version',''))" 2>/dev/null || true)
          fi
          if [ -z "$NO_AR" ]; then
            echo "nada publicado ainda (ou manifesto ilegível) — segue."
            exit 0
          fi
          MAIOR=$(python3 - "$NO_AR" "$NOVA" <<'PY2'
          import sys
          def v(s): return [int(x) for x in s.split('.') if x.isdigit()] or [0]
          a, b = v(sys.argv[1]), v(sys.argv[2])
          n = max(len(a), len(b)); a += [0]*(n-len(a)); b += [0]*(n-len(b))
          print("sim" if a > b else "nao")
          PY2
          )
          if [ "$MAIOR" = "sim" ] && [ "$PERMITIR_REGRESSAO" = "true" ]; then
            echo "::warning::REGRESSÃO AUTORIZADA À MÃO: web-latest está na v$NO_AR e este run publica a v$NOVA"
            echo "Canal OTA: **regressão autorizada à mão**. O \`web-latest\` estava na v$NO_AR e este run publica a v$NOVA. Todo aparelho que já tenha a v$NO_AR vai RECUSAR este bundle em silêncio — só uma reinstalação o alcança." >> "$GITHUB_STEP_SUMMARY"
          elif [ "$MAIOR" = "sim" ]; then
            echo "::warning::web-latest já tem a v$NO_AR e este run traria a v$NOVA — publicação PULADA para o manifesto não regredir"
            echo "Canal OTA: **não publicado**. O \`web-latest\` já está na v$NO_AR e este run traz a v$NOVA — publicar rebaixaria o manifesto, e o aparelho descartaria em silêncio." >> "$GITHUB_STEP_SUMMARY"
            echo "HOLD=true" >> "$GITHUB_ENV"
          else
            echo "no ar: v$NO_AR · este run: v$NOVA — segue."
          fi

      - name: Empacotar a base web
        if: env.HOLD != 'true'
        run: |
          set -euo pipefail
          SRC="$GITHUB_WORKSPACE/app/src/main/assets/web/version.json"
          VERSION=$(python3 -c "import json;print(json.load(open('$SRC'))['version'])")
          # O NOME DO ZIP CARREGA A VERSÃO, e isso não é cosmético.
          #
          # Ele era `web-assets.zip`, SUBSTITUÍDO no lugar a cada publicação —
          # e o próprio comentário do `concurrency` acima já reconhecia o
          # desfecho: duas execuções intercaladas deixam o zip de uma com o
          # sha256 da outra, e a partir daí **todo aparelho baixa, confere o
          # hash, reprova e o OTA fica INERTE até o próximo push**, sem sinal
          # nenhum. A fila reduzia a chance; ela não fechava a classe, porque
          # nada impede a fila de ser furada por um `retag` ou por uma execução
          # que morra entre os dois uploads. Um nome imutável por versão fecha:
          # o zip da versão N nunca é sobrescrito, então um manifesto que fale
          # da versão N sempre encontra o zip da versão N. De quebra, some a
          # janela em que um cache intermediário pode devolver o zip de ontem
          # no endereço de hoje.
          ZIP="$GITHUB_WORKSPACE/web-$VERSION.zip"
          META="$GITHUB_WORKSPACE/version.json"

          # O zip preserva o prefixo `web/` para que o caminho dentro do
          # bundle bata 1:1 com a URL servida pelo asset loader.
          rm -f "$ZIP"
          (cd "$GITHUB_WORKSPACE/app/src/main/assets" && zip -qr "$ZIP" web)

          SHA=$(sha256sum "$ZIP" | cut -d' ' -f1)

          python3 - "$SRC" "$META" "$SHA" "$GITHUB_REPOSITORY" "$(basename "$ZIP")" <<'PY'
          import json, os, sys
          src, out, sha, repo, nome = sys.argv[1:6]
          meta = json.load(open(src))
          saida = {
              "version": meta["version"],
              "minShell": int(meta["minShell"]),
              "sha256": sha,
              "assets": f"https://github.com/{repo}/releases/download/web-latest/{nome}",
          }
          # O BLOCO `shell` É O RECADO PARA O APARELHO: "esta base web vem com um
          # APK, e ele está aqui". Sem ele o app trata a atualização como OTA
          # puro — que é o caso comum e continua funcionando igual.
          bruto = os.environ.get("SHELL_JSON", "").strip()
          if bruto:
              saida["shell"] = json.loads(bruto)
          json.dump(saida, open(out, "w"), indent=2)
          PY

          echo "Bundle: $(du -h "$ZIP" | cut -f1)"
          cat "$META"
          echo "ZIP_NOME=$(basename "$ZIP")" >> "$GITHUB_ENV"

      # Tag fixa: a URL do `version.json` precisa ser estável, porque está
      # compilada no shell. O ZIP, não — ele é encontrado PELO manifesto, e por
      # isso pode (e deve) ter nome versionado. Ou seja, o único arquivo
      # substituído no lugar passa a ser o manifesto, que é minúsculo, tem
      # `?t=` anti-cache do lado do app e é escrito por ÚLTIMO: mesmo uma
      # publicação interrompida no meio deixa o estado anterior íntegro, em vez
      # de um sha órfão.
      - uses: softprops/action-gh-release@v2
        if: env.HOLD != 'true'
        with:
          tag_name: web-latest
          name: Base web (canal OTA)
          prerelease: true
          files: |
            ${{ env.ZIP_NOME }}
            version.json
          body: |
            **Infraestrutura — não é para instalar.**

            Canal de atualização da base web: o app consulta o `version.json`
            aqui e baixa o `web-<versão>.zip` que ele apontar. Os APKs para
            instalar estão nas releases `v*`.

      # Com nome versionado os zips ACUMULAM, e um asset de release não é
      # recolhido por ninguém. Ficam os três mais novos: o servido, o que acabou
      # de sair e uma folga para o aparelho que estava baixando o anterior no
      # instante da publicação — apagar o que alguém está baixando devolveria um
      # 404 no meio do download, que é justamente o tipo de falha intermitente
      # que este lote existe para acabar.
      # A ORDEM É POR DATA DE UPLOAD, E O ATUAL É INTOCÁVEL.
      #
      # Este passo ordenava por VERSÃO (`sort -V -r`) e guardava os três
      # primeiros — o que supõe que o bundle mais NOVO é também o de maior
      # NÚMERO. Uma renumeração quebra a suposição: na v1.0 o `web-1.0.zip`
      # ordenou abaixo de `web-5.316`/`web-5.317` e foi recolhido no mesmo run
      # que acabara de subi-lo. O manifesto ficou apontando para um 404, que é o
      # estado "OTA inerte" descrito no `concurrency` deste job — e ele não erra
      # alto: o aparelho baixa, falha e retenta, para sempre.
      #
      # Duas correções, e a primeira sozinha não basta: a data é a chave certa,
      # mas o que garante a correção é o ATUAL sair da lista de candidatos antes
      # de qualquer corte. O zip que o manifesto anuncia nunca é recolhível.
      - name: Recolher bundles antigos
        if: env.HOLD != 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ATUAL="web-$(python3 -c "import json;print(json.load(open('app/src/main/assets/web/version.json'))['version'])").zip"
          echo "protegido (o que o manifesto anuncia): $ATUAL"
          gh release view web-latest --repo "$GITHUB_REPOSITORY" --json assets \
            --jq '.assets[] | select(.name | test("^web-.*\\.zip$")) | [.createdAt, .name] | @tsv' \
            | sort -r | cut -f2 | grep -vxF "$ATUAL" | tail -n +3 | while read -r velho; do
              echo "recolhendo $velho"
              gh release delete-asset web-latest "$velho" \
                --repo "$GITHUB_REPOSITORY" --yes || true
            done

  apk:
    # No evento `release` não há APK a construir: a Release ACABOU de publicar
    # um. Rodar aqui recompilaria o mesmo commit para jogar o resultado fora —
    # e, pior, o `PUBLISH` daria falso (não é tag nem dispatch), então sairia um
    # build de debug consumindo minutos de runner por nada.
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    steps:
      # `fetch-depth: 0` porque o versionCode sai da CONTAGEM DE COMMITS (ver
      # "Definir versão"), e um clone raso devolveria 1.
      # `ref`: num disparo manual COM release_tag, o código vem de `main` — a
      # tag/Release também nasce lá (target_commitish), e sem isto o APK podia
      # ser compilado de uma branch `claude/**` (que o `on.push` permite)
      # enquanto a tag apontava para main: binário publicado ≠ commit da tag.
      # Vazio = comportamento padrão da action (o próprio ref do evento), que é
      # o certo para push de tag, push de branch e PR.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.release_tag != '' && 'main' || '' }}

      # O runner ubuntu-latest já traz o Android SDK e o JDK — nenhuma
      # infraestrutura externa é necessária para gerar o APK.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Permissão de execução do wrapper
        run: chmod +x ./gradlew

      # OS TESTES UNITÁRIOS EM JVM, E SEM `continue-on-error`.
      #
      # Este passo existe pelos arquivos PUROS do telão por comandos —
      # `EspelhoHttp.kt`, `EspelhoPares.kt`, `EspelhoMidiaCache.kt` e
      # `EspelhoInterfaces.kt` (ver docs/TELAO-POR-COMANDOS.md): eles são o
      # ÚNICO código do projeto que encara a rede.
      #
      # O `EspelhoInterfaces` entrou com o ponto de acesso, e ele é o que mais
      # depende deste passo: ele decide EM QUE INTERFACE o socket abre, e errar
      # para o lado aberto põe o servidor no fio do dongle (o Group Owner do
      # Wi-Fi Direct serve `192.168.49.1` — privado, no ar, sem `Network` que o
      # reivindique, a forma exata que a regra procura). E é Kotlin: quando ele
      # erra num aparelho, não há OTA que conserte. Tudo o mais que entra no app
      # vem do operador (SAF, compartilhamento) ou de uma URL que o próprio app
      # cunhou; ali entra o que um desconhecido na rede da igreja mandar. E é o
      # único código em que um erro não vira pixel errado: vira controle de acesso
      # quebrado — um parser que se perde no `read()` parcial, um teto que não
      # segura, um 404 que responde diferente conforme o que existe atrás dele.
      #
      # É também o único que TEM oráculo sem aparelho: os dois arquivos são puros
      # (zero import de android.*) e recebem o relógio por parâmetro, então prazo
      # de seis horas e bloqueio de um minuto se verificam em milissegundos. O
      # documento que desenhou o espelho recusou o RFC 6455 por ser "protocolo sem
      # oráculo" — escrever um parser HTTP com autenticação sem teste seria o mesmo
      # argumento aplicado contra ele mesmo (a justificativa inteira, como
      # TERCEIRA EXCEÇÃO à regra de zero dependência, está no `dependencies` do
      # app/build.gradle.kts).
      #
      # Sem `continue-on-error`, e desde a v5.316 nenhum passo de TESTE tem: aqui
      # não há download de navegador nem rede para falhar por infraestrutura — é
      # Kotlin puro no JDK que o runner já tem. Uma falha aqui é defeito, e um
      # defeito nesta camada não pode virar APK.
      - name: Testes unitários (JVM)
        run: ./gradlew --no-daemon testDebugUnitTest

      # A versão sai da tag (v1.1 → versionName 1.1). O versionCode NÃO sai
      # mais do número da execução: `github.run_number` conta por WORKFLOW, e
      # renomear o `apk.yml` (ou trocar o `name:`) reinicia a contagem em 1 —
      # o versionCode despencaria e o Android recusaria a instalação por cima
      # (INSTALL_FAILED_VERSION_DOWNGRADE), forçando desinstalar, que é a perda
      # de IndexedDB/OPFS que a keystore fixa existe para evitar. A contagem de
      # commits é monotônica de verdade e independe do nome do workflow. O
      # deslocamento de 100000 existe só para o primeiro APK desta regra ficar
      # ACIMA do último publicado pela regra antiga (o Android exige que o
      # versionCode apenas CRESÇA, e a contagem de commits pode ser menor que o
      # run_number acumulado): se algum dia um versionCode já publicado chegar
      # perto dele, aumente o deslocamento — nunca o diminua.
      - name: Definir versão
        env:
          RELEASE_TAG: ${{ github.event.inputs.release_tag }}
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            TAG="$RELEASE_TAG"
          elif [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG=""
          fi
          if [ -n "$TAG" ]; then
            echo "APK_NAME=$TAG" >> "$GITHUB_ENV"
            echo "VERSION_NAME=${TAG#v}" >> "$GITHUB_ENV"
          else
            echo "APK_NAME=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
            echo "VERSION_NAME=0.0-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          fi
          echo "VERSION_CODE=$((100000 + $(git rev-list --count HEAD)))" >> "$GITHUB_ENV"

      # Só quando NÃO é publicação: numa Release o APK que sai é o da variante
      # release (passo abaixo), e o de debug era compilado e jogado fora —
      # minutos de runner por um arquivo que ninguém usava. O "Nomear o APK"
      # já escolhe a fonte pelo mesmo PUBLISH, então nenhum fluxo fica sem
      # arquivo.
      - name: Build (debug)
        if: env.PUBLISH != 'true'
        run: ./gradlew --no-daemon assembleDebug

      # Assinado com a keystore fixa quando os secrets existem — é o que
      # permite atualizar por cima sem desinstalar (e sem perder a biblioteca
      # do app: Cronograma, pastas sincronizadas, hinos e Bíblia baixados).
      # `-PrequireSigning=true` faz o PRÓPRIO Gradle reprovar a falta da chave:
      # é ele quem sabe se ela existe. Fora daqui (build local, PR de terceiro,
      # clone) a propriedade não é passada e o release continua caindo na
      # assinatura de debug, compilando normalmente.
      - name: Build (release assinado)
        if: env.PUBLISH == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease -PrequireSigning=true

      # Numa release o arquivo leva o nome da versão (v1.1); fora dela, o SHA
      # curto — assim dá para saber de que commit veio um APK avulso.
      # `SIGNED` diz apenas se o APK veio da VARIANTE release (o passo acima
      # rodou e produziu o arquivo); QUEM assinou é o passo seguinte que
      # confere, com o apksigner. Confundir as duas coisas foi exatamente o
      # defeito que existia aqui.
      - name: Nomear o APK
        run: |
          mkdir -p dist
          if [ "$PUBLISH" = "true" ] && [ -f app/build/outputs/apk/release/app-release.apk ]; then
            SRC=app/build/outputs/apk/release/app-release.apk
            echo "SIGNED=true" >> "$GITHUB_ENV"
          else
            SRC=app/build/outputs/apk/debug/app-debug.apk
            echo "SIGNED=false" >> "$GITHUB_ENV"
          fi
          cp "$SRC" "dist/audio-visual-iasd-${APK_NAME}.apk"
          echo "APK publicado a partir de: $SRC"

      # Checagem POSITIVA: pergunta ao apksigner QUEM assinou o APK que vai ser
      # publicado, em vez de deduzir da existência de um arquivo. A dedução
      # antiga ("existe app-release.apk logo está assinado") era código morto:
      # o build.gradle.kts atribui a signingConfig de debug quando não há
      # keystore, e o AGP só acrescenta o sufixo `-unsigned` ao nome quando a
      # variante não tem signingConfig NENHUM — o arquivo existia sempre,
      # SIGNED virava 'true' e esta etapa era PULADA. O que saía era uma
      # Release assinada com a debug.keystore gerada pelo runner naquela
      # execução: chave diferente a cada run, INSTALL_FAILED_UPDATE_INCOMPATIBLE
      # no aparelho e, como única saída, desinstalar — apagando IndexedDB/OPFS
      # (Cronograma, pastas, hinos e Bíblia baixados).
      # A chave de debug do Android tem CN=Android Debug fixo, então o teste é
      # exato e não depende de conhecer o CN da keystore de produção.
      - name: Conferir assinatura da Release
        if: env.PUBLISH == 'true'
        run: |
          set -euo pipefail
          # Primeiro o caso grosseiro (nem chegou a sair um APK de release), que
          # tem mensagem própria; só depois o que exige a ferramenta.
          if [ "$SIGNED" != "true" ]; then
            echo "::error::Release pedida, mas o APK assinado não foi gerado."
            echo "Confira os secrets KEYSTORE_B64, KEY_ALIAS e KEY_PASSWORD."
            exit 1
          fi
          APK=$(ls dist/*.apk)
          # O apksigner vem no build-tools do SDK do runner; a versão instalada
          # muda com o tempo, então pega-se a mais nova em vez de fixar uma. O
          # `:-` cobre as duas variáveis porque o `set -u` transformaria uma
          # delas ausente numa falha sem explicação.
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK" ]; then
            echo "::error::SDK do Android não encontrado (ANDROID_HOME/ANDROID_SDK_ROOT)."
            exit 1
          fi
          BT=$(ls -d "$SDK"/build-tools/* | sort -V | tail -1)
          CERTS=$("$BT/apksigner" verify --print-certs "$APK")
          echo "$CERTS"
          if echo "$CERTS" | grep -q "CN=Android Debug"; then
            echo "::error::O APK da Release está assinado com a chave de DEBUG."
            echo "Instalar por cima seria recusado pelo Android (a chave de"
            echo "debug muda a cada execução do runner). Confira os secrets"
            echo "KEYSTORE_B64, KEY_ALIAS e KEY_PASSWORD."
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: audio-visual-iasd-apk
          path: dist/*.apk
          if-no-files-found: error

      # Uma Release dá link DIRETO para o .apk — instalar pelo artifact
      # exigiria descompactar um .zip no celular. Num disparo manual, a
      # action cria a tag apontando para o commit construído.
      # Republicar uma tag que já existe. O `action-gh-release` NÃO move uma tag
      # existente — ela continua apontando para onde nasceu —, então apagar a
      # Release junto com a tag é o que permite recriá-la no `target_commitish`
      # abaixo. Fica atrás de um input próprio, desligado por padrão: mover uma
      # tag é destrutivo e não pode ser efeito colateral de uma publicação
      # comum, em que a tag nova simplesmente ainda não existe.
      - name: Mover a tag existente (retag)
        if: env.PUBLISH == 'true' && github.event.inputs.retag == 'true' && github.event.inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.release_tag }}
        run: |
          set -euo pipefail
          # `web-latest` NÃO É UMA RELEASE COMO AS OUTRAS: é o canal OTA, e a
          # URL dela está COMPILADA no shell (`WebUpdater.REPO`). Apagá-la mata
          # a atualização da base web de todo aparelho instalado, para sempre e
          # sem sinal — e não há como republicá-la a não ser rodando o
          # `web-ota` de novo. Nada impedia `release_tag: web-latest` com
          # `retag` ligado, e o custo de um dedo errado era o canal inteiro.
          if [ "$TAG" = "web-latest" ]; then
            echo "::error::web-latest é o canal OTA (a URL está compilada no shell) e nunca pode ser apagada por retag."
            exit 1
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Apagando a Release e a tag $TAG para recriá-las em main…"
            gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          else
            echo "Tag $TAG não existe — nada a mover."
          fi

      - uses: softprops/action-gh-release@v2
        if: env.PUBLISH == 'true'
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          # `target_commitish` só é usado pela API do GitHub para CRIAR a ref
          # quando ela ainda não existe — ou seja, apenas no disparo manual com
          # `release_tag` (e no `retag`, que apaga a tag antes). No fluxo
          # documentado (`git tag v1.0 && git push --tags`) a tag JÁ EXISTE
          # quando o workflow roda, e este campo não faz nada: a Release aponta
          # para onde o `git tag` local foi feito. Quem garante a coerência no
          # disparo manual é o `checkout` com `ref: main` lá em cima — assim o
          # APK publicado vem do MESMO commit que a tag passa a apontar.
          target_commitish: main
          # UM ARQUIVO SÓ, e com a versão no nome. A cópia de nome fixo que
          # existiu na v1.0 saiu: ela dava um link permanente, mas quem entrega
          # o download é a PÁGINA (`site/`), que o workflow de Pages reconstrói
          # a cada Release — então o link versionado nunca envelhece lá. O que
          # sobrava era um segundo `.apk` na página da Release, e duas linhas de
          # ação para uma decisão só é o que este projeto recusa em toda parte.
          files: dist/*.apk
          generate_release_notes: true
          body: |
            Baixe o `.apk` abaixo e instale pelo Chrome do celular
            (o Android vai pedir para autorizar "fontes desconhecidas").

            Conecte a TV (Smart View / MiraScreen / cabo USB-C→HDMI) e abra o
            app: o telão é detectado sozinho e recebe **só o Display**, sem
            espelhar a tela do celular. Sem TV conectada, a projeção continua
            sendo a preview do Controle em tela cheia.

            > **Atualiza por cima.** O APK é assinado com keystore fixa:
            > instale sobre a versão anterior sem desinstalar — os dados do app
            > (Cronograma, pastas sincronizadas, hinos e Bíblia baixados) são
            > preservados.
