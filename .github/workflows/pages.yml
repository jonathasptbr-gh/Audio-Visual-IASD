# A PÁGINA DE ACESSO — o endereço que se dá a alguém.
#
# Ela mora em `site/` e NÃO em `docs/`: aquele nome já é a árvore de
# arquitetura, e a opção "publicar da pasta /docs" do GitHub poria o
# `CONTROLE.md` e o `HISTORICO.md` no ar como site.
#
# O QUE ESTE WORKFLOW FAZ ALÉM DE PUBLICAR: ele ESCREVE a versão, o tamanho e a
# URL do `.apk` dentro do HTML, lidos da Release mais recente. A página não pode
# descobrir isso sozinha em tempo de execução — MEDIDO: o asset de release
# responde SEM `Access-Control-Allow-Origin`, então um `fetch()` do navegador é
# bloqueado pelo CORS, e perguntar à API custaria o limite de 60 requisições por
# hora por IP. Escrever no deploy é determinístico e não depende de nada em
# runtime.
#
# E É POR ISSO QUE ELE PRECISA DISPARAR QUANDO UMA RELEASE SAI, não só quando
# `site/` muda. Sem isso o link da página aponta para a Release ANTERIOR até
# alguém lembrar de reconstruir — e o modo de falhar é mudo: a pessoa baixa uma
# versão velha achando que é a nova. Foi essa obrigação que substituiu o asset
# de nome fixo que existiu na v1.0.
#
# `release: published` NÃO BASTA, E ISSO FOI MEDIDO (v1.0.1). A Release deste
# repositório nasce do `action-gh-release` com o GITHUB_TOKEN padrão, e evento
# originado nesse token não cria execução nova de workflow — a mesma armadilha
# que o `apk.yml` documenta no `on:` dele. Contado na API: `release` disparou
# **zero** vezes em 136 execuções. A v1.0.1 saiu às 17:40 e a última publicação
# da página era das 17:33: por sete minutos o botão "Baixar grátis" serviu o
# `.apk` da v1.0, sem nada na tela dizendo isso.
#
# O `apk.yml` contorna com ORDEM DE JOB (o `web-ota` espera o `apk` no mesmo
# run). Aqui não dá: é outro workflow, e `needs` não atravessa arquivo. Quem
# atravessa é `workflow_run` — o mecanismo de encadeamento do próprio GitHub,
# que existe justamente para isto e NÃO é suprimido pelo guarda de recursão.
#
# A linha `release` fica pelo mesmo motivo que fica no `apk.yml`: quando a
# Release nasce de outra mão (a interface do GitHub, ou um PAT), ela dispara de
# verdade — e aí é o caminho mais direto.
name: Publicar a página

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_run:
    workflows: ['Build APK']
    types: [completed]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# UMA publicação por vez, e SEM cancelar a que está correndo: o deploy do Pages
# troca o site inteiro, e abortar no meio deixa a versão antiga no ar sem que
# nada diga isso.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    # O `workflow_run` chega de TODA execução do "Build APK" — inclusive das
    # branches de trabalho e das que falharam. Publicar a partir de uma delas
    # poria no ar a página de um commit que não é o de `main`, e publicar de uma
    # falha poria no ar uma página cuja Release pode nem existir. Os outros três
    # gatilhos passam direto: `push` já é filtrado por branch, e `release` e
    # `workflow_dispatch` são decisões explícitas.
    if: >-
      github.event_name != 'workflow_run'
      || (github.event.workflow_run.conclusion == 'success'
          && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # A Release mais recente que NÃO é infraestrutura. `web-latest` (o bundle
      # da base web) e `dados-latest` (os faróis de uso) nunca devem ser
      # oferecidas para download — as duas são `prerelease`, então
      # `--exclude-pre-releases` já as tira,
      # mas o filtro por tag fica explícito porque uma release marcada errado
      # colocaria um zip de assets no botão "Baixar para Android".
      - name: Ler a Release publicada
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REL=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 20 \
                  --exclude-pre-releases --json tagName \
                  --jq '[.[] | select(.tagName != "web-latest" and .tagName != "dados-latest")][0].tagName')
          if [ -z "$REL" ] || [ "$REL" = "null" ]; then
            echo "::error::Nenhuma Release publicada — a página não tem o que oferecer."
            exit 1
          fi
          echo "Release: $REL"
          gh release view "$REL" --repo "$GITHUB_REPOSITORY" --json assets > rel.json
          python3 - "$REL" <<'PY' >> "$GITHUB_ENV"
          import json, sys
          tag = sys.argv[1]
          apk = next((a for a in json.load(open('rel.json'))['assets']
                      if a['name'].lower().endswith('.apk')), None)
          if not apk:
              # Uma página que oferece um download inexistente é pior que uma
              # página sem botão: a pessoa toca, recebe 404 e conclui que o app
              # não existe.
              print('::error::A Release não tem .apk — nada a publicar.', file=sys.stderr)
              raise SystemExit(1)
          n = apk['size']
          # MB com uma casa: "4,4 MB" é o que a pessoa precisa saber antes de
          # baixar num plano de dados. Vírgula, que é o separador decimal daqui.
          print(f"AV_TAG={tag.lstrip('vV')}")
          print(f"AV_TAMANHO={n/1048576:.1f}".replace('.', ',') + " MB")
          print(f"AV_URL={apk['url']}")
          PY

      # ===== A VERSÃO É A QUE O APARELHO VAI RODAR, NÃO A DO INSTALADOR =====
      #
      # A tag da Release é a versão do APK, e ela FICA PARADA: um lote só de base
      # web sai por OTA e não gera Release nenhuma. Foi o que aconteceu entre a
      # v1.0.1 e a v1.0.2 — o app no aparelho mostrava 1.0.2 e a página anunciava
      # 1.0.1, com todo o mecanismo funcionando. Para quem lê, o número do site
      # tinha simplesmente parado.
      #
      # Quem responde "quão novo é este app?" é o MANIFESTO DO CANAL OTA: a base
      # web que todo aparelho recebe minutos depois de abrir. Ele é asset de
      # release (não consome limite de API) e é o que de fato está PUBLICADO —
      # ler o `version.json` do repositório anunciaria uma versão que o
      # `shellTag` ainda pode estar segurando.
      #
      # O TAMANHO E A URL CONTINUAM VINDO DO APK, porque é ele que se baixa.
      - name: A versão que o aparelho vai rodar
        run: |
          set -euo pipefail
          URL="https://github.com/$GITHUB_REPOSITORY/releases/download/web-latest/version.json"
          BASE=$(curl -fsSL -H 'Cache-Control: no-cache' "$URL?t=$(date +%s)" \
                   | python3 -c 'import json,sys; print(json.load(sys.stdin)["version"])' || true)
          if [ -n "$BASE" ]; then
            echo "AV_VERSAO=$BASE" >> "$GITHUB_ENV"
            echo "Base web publicada: $BASE (APK: $AV_TAG)"
          else
            # NUNCA EM SILÊNCIO: sem o manifesto a página volta a mostrar a
            # versão do APK, que é correta e velha — e é justamente o estado que
            # não se distingue de "está tudo certo".
            echo "::warning::Manifesto do canal OTA ilegível — a página vai com a versão do APK ($AV_TAG)."
            echo "AV_VERSAO=$AV_TAG" >> "$GITHUB_ENV"
          fi

      # A substituição é por PLACEHOLDER, não por regex sobre o HTML: um
      # `sed` que procurasse "versão X" casaria com qualquer texto parecido que
      # a página ganhasse depois.
      - name: Escrever a versão na página
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, pathlib
          p = pathlib.Path('site/index.html')
          t = p.read_text(encoding='utf-8')
          troca = {
              '{{VERSAO}}':  os.environ['AV_VERSAO'],
              '{{TAMANHO}}': os.environ['AV_TAMANHO'],
              '{{URL_APK}}': os.environ['AV_URL'],
          }
          for k, v in troca.items():
              t = t.replace(k, v)
          # NENHUM placeholder pode sobrar. Um `{{VERSAO}}` literal na página
          # publicada é o tipo de defeito que ninguém relata: parece detalhe, e
          # quem vê conclui que o site está quebrado.
          assert '{{' not in t, 'sobrou placeholder no HTML: ' + t[t.index('{{'):t.index('{{')+40]
          p.write_text(t, encoding='utf-8')
          print('escrito:', troca)
          PY

      # O Jekyll é o processador padrão do Pages e come qualquer caminho
      # começado por `_`. Nada aqui começa assim hoje — o arquivo é seguro
      # barato contra o dia em que alguém acrescentar um `_partial`.
      - name: Desligar o Jekyll
        run: touch site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
