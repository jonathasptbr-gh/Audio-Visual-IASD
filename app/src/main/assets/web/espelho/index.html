<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- ANÔNIMA ATÉ O PAREAMENTO (§3.5, invariante 7).
       Sem versão do app, sem nome do aparelho, sem SSID, sem nome da igreja —
       nem aqui no <title>, nem em nenhum texto abaixo, nem num comentário que
       viaje no HTML. Quem abriu este endereço ainda não provou nada, e
       reconhecimento não se dá de graça: um `<title>` dizendo o nome da igreja
       transformaria um IP varrido ao acaso numa informação sobre um prédio.
       "Tela" é tudo o que esta página tem direito de dizer antes do código. -->
  <title>Tela</title>
  <!-- Nada de `<link rel="icon">`, `manifest` ou `theme-color`: os três só
       existem para o navegador GUARDAR a página (histórico, tela inicial,
       aba fixada), e o token do espelho morre com a sessão de propósito. -->
  <link rel="stylesheet" href="/e.css">
</head>
<body>

<!-- ============================================================
     UMA PÁGINA, DOIS ESTADOS — e é por isso que o token nunca
     entra numa URL (§3.5, invariante 2).
     Não há navegação entre a entrada e o player: os dois moram
     aqui e o JS troca qual está `hidden`. Se fossem duas páginas,
     o token teria de atravessar de uma para a outra, e o único
     canal barato para isso seria a URL — que vaza para o
     histórico, para o cache, para a captura de tela e para o
     compartilhamento de tela. Ele vive em `sessionStorage` e sobe
     em `Authorization: Bearer`, e mais nada.
     ============================================================ -->

<!-- ---------- estado 1: ENTRAR ----------
     UM CAMPO E UM BOTÃO, e mais nada (v5.185).

     O botão faz TRÊS coisas no mesmo toque — entra, liga o som e vai para tela
     cheia —, e isso não é economia de cliques: é a única forma de as três
     acontecerem. `requestFullscreen()` e sair do `muted` exigem ATIVAÇÃO
     TRANSITÓRIA DO USUÁRIO, e um gesto só vale por um punhado de segundos.
     Qualquer coisa entre o toque e elas (uma fila de aprovação no celular, um
     segundo botão depois de conectar) gasta o gesto e deixa a tela entrando
     muda e em janela — com alguém tendo de atravessar o salão para tocar nela.

     Foi por isso que o QR e a fila de aprovação saíram junto. O QR existia para
     inverter quem mostra e quem lê o segredo, e a inversão perdeu a razão de
     ser quando o segredo virou três dígitos que a TELA digita. -->
<section id="par" class="tela">
  <div class="cartao">
    <h1>Tela</h1>
    <p class="ajuda">Digite o código que aparece no celular.</p>

    <!-- `inputmode` e `pattern`, não `type="number"`: um campo numérico traz as
         setinhas de incremento, aceita sinal e expoente, e come o zero à
         esquerda — e um código de três dígitos começa com zero uma vez em cada
         dez. `autofocus` porque esta página não tem outro lugar para o cursor
         ir, e num controle remoto de TV cada tecla até o campo é um atrito. -->
    <div class="entrada">
      <input id="cod" class="cod" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="3"
             autocomplete="off" autocorrect="off" spellcheck="false" autofocus
             aria-label="Código de três dígitos">
      <button id="parBtn" class="botao">Conectar</button>
    </div>

    <p id="parMsg" class="msg" role="status" aria-live="polite"></p>
  </div>
</section>

<!-- ---------- estado 2: PLAYER ---------- -->
<section id="play" class="tela" hidden>
  <!-- `muted` e `playsinline` no HTML, não no JS: a política de autoplay é
       avaliada quando o elemento começa a tocar, e "muted autoplay is always
       allowed". Um `video.muted = true` que só rodasse depois de um `play()`
       chegaria tarde. `playsinline` impede o iOS de abrir o player em tela
       cheia por conta própria, o que tiraria a página do ar.
       `disableremoteplayback` sai no JS (não há atributo em todo navegador). -->
  <video id="v" muted playsinline autoplay></video>

  <!-- DOIS ÍCONES, DUAS DECISÕES — e desde a v5.185 eles são o DESFAZER.
       O botão "Conectar" já entra com som e em tela cheia, porque é ele que
       carrega o gesto do visitante. A tela da sala anexa quer as duas; a do
       saguão quer imagem cheia e SILÊNCIO (a PA está a 200 ms dali), e quem
       descobre o eco precisa de um lugar para desfazer sem recarregar a página
       — que é justamente o que faltava quando havia um botão só.

       O SOM DEIXOU DE SER OPT-IN NA TELA (v5.185), e a inversão precisa estar
       escrita: até aqui o ícone nascia riscado e NADA no cliente ligava o som
       além do toque do visitante — o que produziu, no primeiro culto de teste,
       um Registro dizendo `som torneira:nao` ("esta tela nunca pediu") e a
       leitura na sala "o celular não está enviando som". Agora quem liga é o
       botão "Conectar", porque é ele que carrega o gesto.

       O que NÃO mudou: o som é por TELA e ninguém o liga de fora. Três telas
       com som dentro da igreja continuam sendo três alto-falantes com eco, e a
       resposta a isso é este ícone — visível, no primeiro toque, sem recarregar
       nada.

       `type="button"`: sem `<form>` em volta o padrão já seria esse, mas um
       botão que some e volta é exatamente o lugar em que um `submit` acidental
       recarregaria a página e derrubaria a sessão. -->
  <div id="ctrl" class="ctrl">
    <button id="btnSom" class="ctrl-btn" type="button" title="Ligar o som" aria-label="Ligar o som">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M4 9.5h3.2L12 5.4v13.2L7.2 14.5H4z"/>
        <path class="som-on" d="M16 9.2a4 4 0 0 1 0 5.6"/>
        <path class="som-on" d="M18.6 6.6a7.6 7.6 0 0 1 0 10.8"/>
        <path class="som-off" d="M16.5 10l5 4"/>
        <path class="som-off" d="M21.5 10l-5 4"/>
      </svg>
    </button>
    <button id="btnFull" class="ctrl-btn" type="button" title="Tela cheia" aria-label="Tela cheia">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path class="full-in" d="M4 9V5.5A1.5 1.5 0 0 1 5.5 4H9"/>
        <path class="full-in" d="M15 4h3.5A1.5 1.5 0 0 1 20 5.5V9"/>
        <path class="full-in" d="M20 15v3.5a1.5 1.5 0 0 1-1.5 1.5H15"/>
        <path class="full-in" d="M9 20H5.5A1.5 1.5 0 0 1 4 18.5V15"/>
        <path class="full-out" d="M9 4v3.5A1.5 1.5 0 0 1 7.5 9H4"/>
        <path class="full-out" d="M20 9h-3.5A1.5 1.5 0 0 1 15 7.5V4"/>
        <path class="full-out" d="M15 20v-3.5a1.5 1.5 0 0 1 1.5-1.5H20"/>
        <path class="full-out" d="M4 15h3.5A1.5 1.5 0 0 1 9 16.5V20"/>
      </svg>
    </button>
  </div>
  <p id="dica" class="dica">Toque no alto-falante para tirar o som · na moldura para sair da tela cheia</p>

  <!-- O ESTADO, DESENHADO. Com o app do outro lado do salão, esta linha é a
       única coisa que responde "por que a tela está preta?". -->
  <div id="aviso" class="aviso" role="status" aria-live="polite"></div>
</section>

<!-- A ORDEM IMPORTA: `cliente.js` usa `window.AVFmp4` na primeira chamada de
     `csd()`, que só acontece depois do primeiro byte do fluxo — mas carregar o
     muxer depois do cliente deixaria uma janela em que um fluxo muito rápido
     chegaria antes dele. Dois `<script>` clássicos (sem `defer`, sem
     `type=module`) executam na ordem em que aparecem, e é isso que se quer.

     E OS NOMES DE ROTA SÃO CURTOS DE PROPÓSITO. O mapa que o
     `EspelhoServidor` precisa implementar é FIXO, quatro entradas, nunca por
     concatenação (§3.6, invariante 7 — um `handle("espelho/" + nome)` com
     `nome` vindo da URL serviria `/controle/controle.js` e `/shared/native.js`
     para quem estiver na rede):

         "/"      → espelho/index.html
         "/e.css" → espelho/espelho.css
         "/e.js"  → espelho/cliente.js
         "/f.js"  → espelho/fmp4.js

     Os nomes na rede não são os nomes no disco, e isso é o certo: o que sai
     pelo fio não deve descrever a árvore do bundle. -->
<script src="/f.js"></script>
<script src="/e.js"></script>
</body>
</html>
